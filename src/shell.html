<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Iron Circuit</title>
<style>
  :root{
    --bg:#07070c; --ink:#e8e6f0; --dim:#8b88a3;
    --accent:#ffcc33; --accent2:#ff5566; --good:#5ce08a;
    --panel:rgba(12,12,22,.92); --line:rgba(255,255,255,.14);
    --mono:"Courier New",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--mono); overflow:hidden;
    -webkit-font-smoothing:none;
    display:flex; align-items:center; justify-content:center;
  }
  #wrap{
    position:relative; width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(120% 90% at 50% 0%, #14142a 0%, #07070c 70%);
  }
  #screen{
    position:relative;
    image-rendering:pixelated; image-rendering:crisp-edges;
    display:block;
    box-shadow:0 0 0 2px #000, 0 0 0 4px #24243a, 0 30px 80px rgba(0,0,0,.8);
    background:#000; touch-action:none;
  }
  /* ---------- DOM overlay menus ---------- */
  #ui{
    position:absolute; inset:0; display:flex;
    align-items:center; justify-content:center;
    pointer-events:none;
  }
  .panel{
    pointer-events:auto;
    background:var(--panel); border:2px solid var(--line);
    padding:22px 26px; min-width:330px; max-width:min(560px,92vw);
    max-height:86vh; overflow:auto;
    box-shadow:0 20px 60px rgba(0,0,0,.7);
    backdrop-filter:blur(3px);
  }
  .panel h1{
    margin:0 0 2px; font-size:26px; letter-spacing:5px;
    color:var(--accent); text-transform:uppercase;
    text-shadow:2px 2px 0 #a33, 4px 4px 0 rgba(0,0,0,.5);
  }
  .panel h2{margin:0 0 14px;font-size:11px;letter-spacing:3px;color:var(--dim);font-weight:400;text-transform:uppercase}
  .panel h3{margin:16px 0 8px;font-size:11px;letter-spacing:2px;color:var(--accent);text-transform:uppercase}
  .panel p{margin:0 0 12px;font-size:12px;line-height:1.65;color:var(--dim)}
  .panel p b{color:var(--ink);font-weight:700}
  button.mi{
    display:block; width:100%; text-align:left; margin:0 0 7px;
    background:#15152a; color:var(--ink); border:2px solid var(--line);
    padding:11px 13px; font-family:var(--mono); font-size:13px;
    letter-spacing:1.5px; cursor:pointer; text-transform:uppercase;
    transition:background .08s,border-color .08s,transform .08s;
  }
  button.mi:hover,button.mi:focus{background:#22224a;border-color:var(--accent);outline:none;transform:translateX(3px)}
  button.mi:disabled{opacity:.35;cursor:not-allowed;transform:none}
  button.mi .sub{display:block;font-size:10px;color:var(--dim);letter-spacing:.5px;margin-top:3px;text-transform:none}
  button.ghost{background:transparent;border-color:rgba(255,255,255,.1)}
  .row{display:flex;gap:8px;align-items:center}
  .row>*{flex:1}
  input.code{
    width:100%; background:#0a0a16; border:2px solid var(--line); color:var(--accent);
    font-family:var(--mono); font-size:26px; letter-spacing:10px; text-align:center;
    padding:12px 8px; text-transform:uppercase;
  }
  input.code:focus{outline:none;border-color:var(--accent)}
  .bigcode{
    font-size:38px; letter-spacing:14px; color:var(--accent); text-align:center;
    padding:14px 0 10px; text-shadow:0 0 24px rgba(255,204,51,.35);
  }
  .status{font-size:11px;color:var(--dim);min-height:17px;letter-spacing:1px;margin-top:10px}
  .status.err{color:var(--accent2)}
  .status.ok{color:var(--good)}
  table.keys{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:10px}
  table.keys td{padding:4px 6px;border-bottom:1px solid rgba(255,255,255,.07);color:var(--dim)}
  table.keys td:first-child{color:var(--ink);white-space:nowrap;width:44%}
  kbd{
    background:#22223e;border:1px solid rgba(255,255,255,.2);border-bottom-width:2px;
    border-radius:3px;padding:1px 5px;font-family:var(--mono);font-size:10px;color:var(--ink)
  }
  .hide{display:none!important}
  /* character select grid */
  .csgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:6px 0 4px}
  .cscard{
    background:#15152a;border:2px solid var(--line);padding:9px 8px;cursor:pointer;
    text-align:center;transition:border-color .08s,background .08s;
  }
  .cscard:hover{background:#22224a}
  .cscard.sel{border-color:var(--accent);background:#2a2a12}
  .cscard.p2sel{border-color:#55aaff}
  .cscard .nm{font-size:12px;letter-spacing:2px;text-transform:uppercase;margin-top:5px}
  .cscard .rl{font-size:9px;color:var(--dim);letter-spacing:.5px;margin-top:2px}
  .cscard canvas{image-rendering:pixelated;display:block;margin:0 auto}
  .movelist{font-size:11px;line-height:1.7;color:var(--dim)}
  .movelist b{color:var(--accent);font-weight:400}
  .foot{margin-top:14px;font-size:10px;color:#55536b;letter-spacing:1px;line-height:1.6}
  /* ---------- on-screen controls ---------- */
  #touch{position:absolute;inset:0;z-index:40;touch-action:none;-webkit-user-select:none;user-select:none;display:none}
  body.touch.playing #touch{display:block}
  body.touch #wrap{align-items:flex-start;padding-top:5vh}
  @media (orientation:landscape){ body.touch #wrap{align-items:center;padding-top:0} }
  #tpad{
    position:absolute;left:3.5vw;bottom:7vh;width:min(30vw,148px);aspect-ratio:1;border-radius:50%;
    background:rgba(12,12,22,.34);border:2px solid rgba(255,255,255,.13);
    box-shadow:inset 0 0 0 8px rgba(255,255,255,.03);
  }
  #tnub{
    position:absolute;width:38%;height:38%;left:31%;top:31%;border-radius:50%;
    background:rgba(255,204,51,.62);border:2px solid rgba(0,0,0,.35);
    transition:transform .04s linear;pointer-events:none;
  }
  #tbtns{
    position:absolute;right:3.5vw;bottom:7vh;
    display:grid;grid-template-columns:repeat(3,1fr);gap:min(2.2vw,12px);
  }
  .tbtn{
    width:min(13.5vw,62px);aspect-ratio:1;border-radius:50%;
    background:rgba(12,12,22,.34);border:2px solid rgba(255,255,255,.13);
    color:var(--ink);font-family:var(--mono);font-size:min(3.4vw,15px);letter-spacing:1px;
    display:flex;align-items:center;justify-content:center;
  }
  .tbtn.p{border-color:rgba(255,204,51,.42);color:rgba(255,204,51,.85)}
  .tbtn.k{border-color:rgba(90,168,224,.42);color:rgba(143,201,240,.85)}
  .tbtn.on{background:rgba(255,204,51,.42);color:#fff;border-color:rgba(255,204,51,.9);transform:scale(.92)}
  #thint{
    position:absolute;left:0;right:0;top:32%;text-align:center;pointer-events:none;
    color:var(--dim);font-size:12px;letter-spacing:2px;text-transform:uppercase;
  }
  @media (orientation:landscape){ #thint{display:none} }
  #tpause{
    position:absolute;right:3.5vw;top:2.5vh;width:38px;height:30px;border-radius:6px;
    background:rgba(12,12,22,.4);border:2px solid rgba(255,255,255,.13);color:rgba(232,230,240,.8);
    font-family:var(--mono);font-size:13px;display:flex;align-items:center;justify-content:center;
  }
  /* ---------- key binding table ---------- */
  table.binds{width:100%;border-collapse:collapse;font-size:11px}
  table.binds th{
    text-align:left;color:var(--accent);font-weight:400;letter-spacing:2px;
    font-size:10px;text-transform:uppercase;padding:0 6px 6px;
  }
  table.binds td{padding:3px 6px;border-bottom:1px solid rgba(255,255,255,.07);color:var(--dim)}
  table.binds td:first-child{color:var(--ink);width:42%}
  button.keycap{
    width:100%;background:#15152a;border:2px solid var(--line);color:var(--ink);
    font-family:var(--mono);font-size:10px;padding:5px 4px;cursor:pointer;letter-spacing:1px;
  }
  button.keycap:hover{border-color:var(--accent)}
  button.keycap.listening{border-color:var(--accent);color:var(--accent);background:#2a2a12}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="screen" width="384" height="216"></canvas>
  <div id="ui"></div>
  <div id="touch"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>
//__BUNDLE__
</script>
</body>
</html>
