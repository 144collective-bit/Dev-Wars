  "*":"...../.#.#./..#../#####/..#../.#.#./.....",
  "=":"...../...../#####/...../#####/...../.....",
  ">":".#.../..#../...#./....#/...#./..#../.#...",
  "<":"...#./..#../.#.../#..../.#.../..#../...#."
};
const GLYPH_ROWS = {};
for (const c in GLYPHS) GLYPH_ROWS[c] = GLYPHS[c].split("/");

function textWidth(str, sc=1, sp=1){ return str.length * (5 + sp) * sc - sp * sc; }

function drawText(ctx, str, x, y, color, sc=1, sp=1){
  str = String(str).toUpperCase();
  ctx.fillStyle = color;
  let cx = x;
  for (let i = 0; i < str.length; i++){
    const rows = GLYPH_ROWS[str[i]] || GLYPH_ROWS["?"];
    for (let r = 0; r < 7; r++){
      const row = rows[r];
      let run = -1;
      for (let c = 0; c <= 5; c++){
        const on = c < 5 && row[c] === "#";
        if (on && run < 0) run = c;
        else if (!on && run >= 0){ ctx.fillRect(cx + run*sc, y + r*sc, (c-run)*sc, sc); run = -1; }
      }
    }
    cx += (5 + sp) * sc;
  }
}
function drawTextC(ctx, str, cx, y, color, sc=1, sp=1){
  drawText(ctx, str, Math.round(cx - textWidth(String(str), sc, sp)/2), y, color, sc, sp);
}
function drawTextShadow(ctx, str, x, y, color, shadow, sc=1, sp=1){
  drawText(ctx, str, x + sc, y + sc, shadow, sc, sp);
  drawText(ctx, str, x, y, color, sc, sp);
}

/* ============================================================================
   FIGHTER SPRITE RENDERING
   ----------------------------------------------------------------------------
   A pose is rasterised into a small offscreen canvas and cached, keyed by
   character + pose + facing + tint. Poses are held for several frames at a
   time, so in practice each unique frame is drawn once for the whole match.
   ========================================================================== */

const SPRITE_W = 150, SPRITE_H = 130, SPRITE_OX = 75, SPRITE_OY = 112;
const spriteCache = new Map();
const OUTLINE = "#14141f";

/* Chunky capsule between two points: stamps square pixels along the segment
   so edges stay hard instead of antialiasing into mush. */
function limb(ctx, x0, y0, x1, y1, t, color){
  const dx = x1 - x0, dy = y1 - y0;
  const steps = Math.max(Math.abs(dx), Math.abs(dy), 1);
  const h = t >> 1;
  ctx.fillStyle = color;
  for (let i = 0; i <= steps; i++){
    const x = Math.round(x0 + dx * i / steps) - h;
    const y = Math.round(y0 + dy * i / steps) - h;
    ctx.fillRect(x, y, t, t);
  }
}
function blob(ctx, x, y, w, h, color){
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x - w/2), Math.round(y - h/2), w, h);
}
/* Rectangle with the four corner pixels knocked out — reads as "round" at
   this resolution without any antialiasing. */
function roundRect(ctx, x, y, w, h, color){
  ctx.fillStyle = color;
  ctx.fillRect(x + 1, y, w - 2, h);
  ctx.fillRect(x, y + 1, w, h - 2);
}

function buildSprite(ch, pose, facing, tint){
  const cv = document.createElement("canvas");
  cv.width = SPRITE_W; cv.height = SPRITE_H;
  const c = cv.getContext("2d");
  const sc = ch.scale, b = ch.bulk, pal = ch.pal;
  const J = {};
  for (const k in pose){
    J[k] = [ SPRITE_OX + facing * Math.round(pose[k][0] * sc),
             SPRITE_OY + Math.round(pose[k][1] * sc) ];
  }
  const hipF = [ J.pv[0] + facing * 3, J.pv[1] + 1 ];
  const hipB = [ J.pv[0] - facing * 3, J.pv[1] + 1 ];

  const wUA = 6 + b, wFA = 5 + b, wTH = 9 + b, wSH = 7 + b, wTO = 16 + b*2;
  const headW = 14 + (b > 0 ? 2 : 0), headH = 15 + (b > 0 ? 1 : 0);

  const col = tint === "flash" ? () => "#ffffff" : (x => x);
  const OL = tint === "flash" ? "#ffffff" : OUTLINE;

  /* Pass 1: silhouette outline, one pixel fatter than every part. */
  const outline = () => {
    limb(c, J.sB[0],J.sB[1], J.eB[0],J.eB[1], wUA+2, OL);
    limb(c, J.eB[0],J.eB[1], J.hB[0],J.hB[1], wFA+2, OL);
    limb(c, hipB[0],hipB[1], J.kB[0],J.kB[1], wTH+2, OL);
    limb(c, J.kB[0],J.kB[1], J.fB[0],J.fB[1], wSH+2, OL);
    limb(c, J.pv[0],J.pv[1], J.nk[0],J.nk[1], wTO+2, OL);
    limb(c, hipF[0],hipF[1], J.kF[0],J.kF[1], wTH+2, OL);
    limb(c, J.kF[0],J.kF[1], J.fF[0],J.fF[1], wSH+2, OL);
    limb(c, J.sF[0],J.sF[1], J.eF[0],J.eF[1], wUA+2, OL);
    limb(c, J.eF[0],J.eF[1], J.hF[0],J.hF[1], wFA+2, OL);
    blob(c, J.hd[0], J.hd[1], headW+2, headH+2, OL);
    blob(c, J.fF[0]+facing*2, J.fF[1], 11, 6, OL);
    blob(c, J.fB[0]+facing*2, J.fB[1], 11, 6, OL);
  };
  outline();

  /* Pass 2: the parts themselves, back to front. */
  /* back arm + back leg sit in shadow */
  limb(c, J.sB[0],J.sB[1], J.eB[0],J.eB[1], wUA, col(pal.suitS));
  limb(c, J.eB[0],J.eB[1], J.hB[0],J.hB[1], wFA - 1, col(pal.skinB));
  blob(c, J.hB[0], J.hB[1], wFA+1, wFA+1, col(pal.skinB));
  limb(c, hipB[0],hipB[1], J.kB[0],J.kB[1], wTH, col(pal.suitS));
  limb(c, J.kB[0],J.kB[1], J.fB[0],J.fB[1], wSH, col(pal.suitS));
  blob(c, J.fB[0]+facing*2, J.fB[1], 9, 4, col(pal.trim));

  /* torso, belt, head */
  limb(c, J.pv[0],J.pv[1], J.nk[0],J.nk[1], wTO, col(pal.suit));
  limb(c, J.pv[0],J.pv[1], J.nk[0],J.nk[1], Math.max(3, wTO-8), col(pal.suitS));
  blob(c, J.pv[0], J.pv[1] + 1, wTO, 4, col(pal.belt));
  blob(c, J.nk[0], J.nk[1] + 3, 7, 5, col(pal.skin));
  const hx = J.hd[0] - (headW>>1), hy = J.hd[1] - (headH>>1);
  roundRect(c, hx, hy, headW, headH, col(pal.skin));
  /* hair: a cap across the crown, plus a wedge down the back of the skull so
     the head reads as facing somewhere even at this size */
  roundRect(c, hx, hy, headW, 5, col(pal.hair));
  c.fillStyle = col(pal.hair);
  c.fillRect(facing > 0 ? hx : hx + headW - 3, hy + 4, 3, 5);
  if (tint !== "flash"){
    c.fillStyle = pal.skinS;
    c.fillRect(hx + 1, hy + 5, headW - 2, 1);                    /* brow */
    c.fillRect(hx + (facing > 0 ? 1 : 2), hy + headH - 3, headW - 3, 2); /* jaw */
    c.fillStyle = pal.eye;
    c.fillRect(J.hd[0] + facing * 2, hy + 7, 2, 3);              /* eye */
  }

  /* front leg + front arm read as lit */
  limb(c, hipF[0],hipF[1], J.kF[0],J.kF[1], wTH, col(pal.suit));
  limb(c, J.kF[0],J.kF[1], J.fF[0],J.fF[1], wSH, col(pal.suit));
  blob(c, J.fF[0]+facing*2, J.fF[1], 9, 4, col(pal.trim));
  limb(c, J.sF[0],J.sF[1], J.eF[0],J.eF[1], wUA, col(pal.suit));
  limb(c, J.eF[0],J.eF[1], J.hF[0],J.hF[1], wFA, col(pal.skin));
  blob(c, J.hF[0], J.hF[1], wFA+3, wFA+3, col(pal.skin));
  return cv;
}

let spriteKeyCounter = 0;
function poseKey(pose){
  if (pose.__k === undefined) Object.defineProperty(pose, "__k", { value: ++spriteKeyCounter });
  return pose.__k;
}
function getSprite(ch, pose, facing, tint){
  const key = ch.key + "|" + poseKey(pose) + "|" + facing + "|" + (tint||"");
  let s = spriteCache.get(key);
  if (!s){ s = buildSprite(ch, pose, facing, tint); spriteCache.set(key, s); }
  return s;
}

/* ============================================================================
   STAGES
   ----------------------------------------------------------------------------
   Each stage is baked once into a few parallax layers, then blitted per frame.
   Backgrounds are purely cosmetic and never touch the simulation.
   ========================================================================== */

function newLayer(w, h){
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  return cv;
}
/* Banded vertical gradient — stepped on purpose, so it dithers like pixel art
   instead of smearing like a CSS gradient. */
function bands(ctx, x, y, w, h, colors){
  const n = colors.length, step = h / n;
  for (let i = 0; i < n; i++){
    ctx.fillStyle = colors[i];
    ctx.fillRect(x, Math.round(y + i*step), w, Math.ceil(step) + 1);
  }
}
function noiseSpeckle(ctx, x, y, w, h, color, count, rng){
  ctx.fillStyle = color;
  for (let i = 0; i < count; i++)
    ctx.fillRect(x + rng() % w, y + rng() % h, 1, 1);
}

function buildStage(key){
  const rng = makeRNG(key.length * 7717 + 13);
  const far = newLayer(STAGE_W, H), near = newLayer(STAGE_W, H);
  const f = far.getContext("2d"), n = near.getContext("2d");
  const FL = GROUND_Y;                       /* floor line */
  let floorTop, floorBot, accent;

  if (key === "dockyard"){
    accent = "#7fd8ff";
    bands(f, 0, 0, STAGE_W, FL - 30, ["#2a2148","#3a2b58","#54386a","#7a4a72","#a5636f","#d08a6f","#e8ab74"]);
    /* sea */
    f.fillStyle = "#243a5e"; f.fillRect(0, FL - 42, STAGE_W, 26);
    for (let i = 0; i < 220; i++){
      const yy = FL - 42 + (rng() % 24);
      f.fillStyle = (rng() % 3) ? "#3a5c86" : "#c8916a";
      f.fillRect(rng() % STAGE_W, yy, 2 + (rng() % 5), 1);
    }
    /* distant cranes */
    for (let i = 0; i < 7; i++){
      const bx = 40 + i * 130 + (rng() % 40), bh = 46 + (rng() % 26);
      f.fillStyle = "#1d2036";
      f.fillRect(bx, FL - 42 - bh, 5, bh);
      f.fillRect(bx - 26, FL - 42 - bh, 60, 4);
      f.fillRect(bx + 26, FL - 42 - bh, 3, 14);
      f.fillStyle = "#e8ab74";
      f.fillRect(bx + 1, FL - 44 - bh, 3, 2);
    }
    /* containers */
    const cols = ["#b8442f","#2f6fb8","#c9a021","#3a8c5c","#7a3fa0"];
    for (let i = 0; i < 26; i++){
      const cw = 46 + (rng()%20), chh = 22, cx = (rng() % (STAGE_W - 60)), stack = 1 + (rng() % 3);
      for (let s = 0; s < stack; s++){
        const cy = FL - 18 - chh*(s+1);
        n.fillStyle = "#14141f"; n.fillRect(cx-1, cy-1, cw+2, chh+2);
        n.fillStyle = cols[rng() % cols.length]; n.fillRect(cx, cy, cw, chh);
        n.fillStyle = "rgba(0,0,0,.22)";
        for (let r = 4; r < cw - 3; r += 5) n.fillRect(cx + r, cy + 3, 2, chh - 6);
      }
    }
    /* shadowed dock wall, so the backdrop meets the floor instead of ending */
    n.fillStyle = "#1b1420"; n.fillRect(0, FL - 20, STAGE_W, 22);
    n.fillStyle = "#2a1f2c"; n.fillRect(0, FL - 20, STAGE_W, 3);
    floorTop = "#6b4a30"; floorBot = "#3b2718";
  }
  else if (key === "foundry"){
    accent = "#ffb347";
    bands(f, 0, 0, STAGE_W, FL - 20, ["#1d1218","#24141a","#31171c","#401c1e","#522420","#6b2f22"]);
    /* roof trusses and hanging lamps, so the top half is not dead space */
    f.fillStyle = "#0e0a10";
    f.fillRect(0, 8, STAGE_W, 7);
    for (let x = 0; x < STAGE_W; x += 26){
      f.fillRect(x, 15, 3, 10);
      f.fillRect(x, 24, 26, 3);
    }
    for (let i = 0; i < 12; i++){
      const lx = 34 + i * 74;
      f.fillStyle = "#0e0a10"; f.fillRect(lx, 27, 2, 14);          /* chain */
      f.fillStyle = "#241820"; f.fillRect(lx - 7, 41, 16, 5);      /* shade */
      f.fillStyle = "#ffd98a"; f.fillRect(lx - 4, 46, 10, 2);      /* filament */
      f.fillStyle = "rgba(255,190,90,.10)";
      for (let k = 0; k < 5; k++) f.fillRect(lx - 5 - k*4, 48 + k*7, 12 + k*8, 7);
    }
    /* furnace mouths glowing */
    for (let i = 0; i < 6; i++){
      const bx = 60 + i * 145, by = FL - 96;
      f.fillStyle = "#0d0810"; f.fillRect(bx - 30, by, 76, 78);
      for (let g = 0; g < 7; g++){
        f.fillStyle = ["#3a1408","#5c1e08","#8a2f08","#c4550c","#ee8a18","#ffcc44","#ffe9a8"][g];
        f.fillRect(bx - 20 + g*2, by + 26 + g*2, 56 - g*4, 44 - g*4);
      }
    }
    /* girders */
    n.fillStyle = "#1a1a24";
    for (let i = 0; i < 14; i++) n.fillRect(i*68, FL - 130, 9, 118);
    n.fillRect(0, FL - 134, STAGE_W, 8);
    n.fillStyle = "#2a2a38";
    for (let i = 0; i < 14; i++) n.fillRect(i*68 + 2, FL - 130, 3, 118);
    n.fillStyle = "#3a3a4c";
    for (let i = 0; i < 14; i++){ n.fillRect(i*68 - 4, FL - 128, 17, 3); n.fillRect(i*68 - 4, FL - 74, 17, 3); }
    /* molten channel behind the fighters */
    n.fillStyle = "#14141f"; n.fillRect(0, FL - 16, STAGE_W, 6);
    n.fillStyle = "#ff8c1a"; n.fillRect(0, FL - 15, STAGE_W, 4);
    noiseSpeckle(n, 0, FL - 15, STAGE_W, 4, "#ffe9a8", 400, rng);
    floorTop = "#3c3742"; floorBot = "#1a1820";
  }
  else { /* neon */
    accent = "#25f0d0";
    bands(f, 0, 0, STAGE_W, FL - 6, ["#08061c","#100a2c","#191040","#28154e","#3c1c56","#57235a","#7c3057"]);
    /* far skyline: flat silhouettes only, so the near towers read as nearer */
    for (let i = 0; i < 44; i++){
      const bw = 24 + (rng()%52), bh = 26 + (rng()%62), bx = (rng() % (STAGE_W - 40));
      f.fillStyle = "#180f32";
      f.fillRect(bx, FL - 26 - bh, bw, bh + 26);
    }
    /* near towers, lit edge and window grid */
    for (let i = 0; i < 18; i++){
      const bw = 40 + (rng()%38), bh = 58 + (rng()%80), bx = (rng() % (STAGE_W - 52));
      const top = FL - 24 - bh;
      n.fillStyle = "#0b0818"; n.fillRect(bx - 1, top - 1, bw + 2, bh + 26);
      n.fillStyle = "#1b1636"; n.fillRect(bx, top, bw, bh + 24);
      n.fillStyle = "#282249"; n.fillRect(bx, top, 3, bh + 24);
      n.fillStyle = "#100c22"; n.fillRect(bx + bw - 3, top, 3, bh + 24);
      for (let wy = top + 6; wy < FL - 30; wy += 8)
        for (let wx = bx + 5; wx < bx + bw - 5; wx += 7)
          if (rng() % 3 === 0){
            n.fillStyle = (rng()%4) ? "#f2d98a" : "#7fe8ff";
            n.fillRect(wx, wy, 3, 4);
          }
    }
    /* hanging neon banners */
    const neons = ["#ff3d8b","#25f0d0","#ffd93d","#8a5cff","#4dd2ff"];
    for (let i = 0; i < 14; i++){
      const cx = 26 + i*62 + (rng()%22), cy = FL - 100 - (rng()%44);
      const col = neons[rng() % neons.length], wdt = 7 + (rng()%4), hgt = 26 + (rng()%22);
      n.fillStyle = "rgba(255,255,255,.06)"; n.fillRect(cx - 4, cy - 4, wdt + 8, hgt + 8);
      n.fillStyle = "#0b0818"; n.fillRect(cx - 1, cy - 1, wdt + 2, hgt + 2);
      n.fillStyle = col; n.fillRect(cx, cy, wdt, hgt);
      n.fillStyle = "rgba(255,255,255,.55)"; n.fillRect(cx + 1, cy + 1, 2, hgt - 2);
      n.fillStyle = "rgba(0,0,0,.34)";
      for (let t = 5; t < hgt - 2; t += 6) n.fillRect(cx, cy + t, wdt, 2);
    }
    /* street-level wall and its reflected glow */
    n.fillStyle = "#07091a"; n.fillRect(0, FL - 24, STAGE_W, 26);
    n.fillStyle = "#161d38"; n.fillRect(0, FL - 24, STAGE_W, 3);
    for (let x = 8; x < STAGE_W; x += 46){
      n.fillStyle = "rgba(37,240,208,.30)"; n.fillRect(x, FL - 18, 18, 2);
      n.fillStyle = "rgba(255,61,139,.22)"; n.fillRect(x + 24, FL - 12, 12, 2);
    }
    floorTop = "#20222e"; floorBot = "#0e0f16";
  }

  /* floor is shared geometry; only the palette changes per stage */
  const floor = newLayer(STAGE_W, H - FL + 10);
  const fc = floor.getContext("2d");
  bands(fc, 0, 0, STAGE_W, H - FL + 10, [floorTop, floorTop, floorBot]);
  fc.fillStyle = "rgba(0,0,0,.35)";
  for (let x = 0; x < STAGE_W; x += 16) fc.fillRect(x, 0, 1, H - FL + 10);
  for (let y = 4; y < H - FL + 10; y += 6) fc.fillRect(0, y, STAGE_W, 1);
  fc.fillStyle = "#14141f"; fc.fillRect(0, 0, STAGE_W, 2);

  return { far, near, floor, accent, floorY: FL };
}

const STAGES = {};
function stageFor(key){
  if (!STAGES[key]) STAGES[key] = buildStage(key);
  return STAGES[key];
}

/* ============================================================================
   MOVE REGISTRY
   ----------------------------------------------------------------------------
   Every move gets a stable numeric id so the desync checksum can include
   "which move is this fighter doing" without hashing object references.
   Both peers build the registry in the same order, so the ids agree.
   ========================================================================== */

const ALL_MOVES = [];
function registerMove(m){ m.num = ALL_MOVES.length + 1; ALL_MOVES.push(m); return m; }
for (const k in NORMALS) registerMove(NORMALS[k]);
const BUTTON_LIST = [IN_LP, IN_MP, IN_HP, IN_LK, IN_MK, IN_HK];
for (const ch of CHARACTERS){
  ch.spMoves = {};
  for (const s of ch.specials){
    ch.spMoves[s.key] = {};
    for (const b of BUTTON_LIST) ch.spMoves[s.key][b] = registerMove(s.make(b));
  }
  ch.superMove = registerMove(ch.super.make());
}

/* ============================================================================
   FIGHTER
   ========================================================================== */

const S = { IDLE:0, WALKF:1, WALKB:2, CROUCH:3, JUMP:4, LAND:5, ATTACK:6,
            HITSTUN:7, BLOCKSTUN:8, KNOCKDOWN:9, GETUP:10, THROWN:11,
            WIN:12, INTRO:13, DEFEAT:14 };

function animPose(anim, frame){
  const fr = anim.frames;
  let total = 0;
  for (const x of fr) total += x[1];
  if (total <= 0) return fr[0][0];
  let t = anim.loop ? (frame % total) : Math.min(frame, total - 1);
  for (const x of fr){ if (t < x[1]) return x[0]; t -= x[1]; }
  return fr[fr.length - 1][0];
}
const boxOverlap = (a, b) =>
  a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;

class Fighter {
  constructor(ch, id){
    this.ch = ch; this.id = id;
    this.maxHp = ch.hp;
    this.mb = new MotionBuffer();
    this.wins = 0;
    this.reset(0, 1, true);
  }
  reset(x, facing, full){
    this.x = x * FP; this.y = 0; this.vx = 0; this.vy = 0;
    this.facing = facing;
    if (full){ this.hp = this.maxHp; this.meter = 0; }
    this.state = S.INTRO; this.stateFrame = 0;
    this.anim = ANIM.intro; this.animFrame = 0;
    this.move = null; this.moveId = 0;
    this.hitstun = 0; this.blockstun = 0; this.downTimer = 0;
    this.airborne = false; this.crouching = false; this.guarding = false;
    this.hitDone = new Set(); this.rehitTimer = 0; this.hitCount = 0;
    this.invuln = 0; this.flash = 0; this.comboHits = 0; this.comboTimer = 0;
    this.comboShow = 0; this.comboShowT = 0;
    this.prevIn = 0; this.curIn = 0; this.cancelOk = false;
    this.projCount = 0; this.throwVictim = null; this.jumpDir = 0;
    this.pressBuf = 0;
    this.mb.reset();
  }
  get scale(){ return this.ch.scale; }
  get pushHalf(){ return Math.round(17 * this.scale * FP); }
  get px(){ return this.x / FP; }          /* float, for rendering only */
  get py(){ return this.y / FP; }

  pose(){
    if (this.state === S.ATTACK && this.move) return animPose(this.move.anim, this.stateFrame);
    return animPose(this.anim, this.animFrame);
  }
  setAnim(a){ if (this.anim !== a){ this.anim = a; this.animFrame = 0; } }
  setState(st, anim){
    this.state = st; this.stateFrame = 0;
    if (anim) this.setAnim(anim);
  }

  /* Hurtboxes come from the HURT table, one entry per pose, so crouching still
     ducks under a high attack and a jumping fighter is still a smaller target
     — but the boxes are now their own data. Moving a joint changes only the
     drawing; changing what can be hit means editing src/hurtboxes.js, which
     is a deliberate gameplay edit and needs a GAME_VERSION bump. */
  hurtBoxes(){
    const spec = HURT[this.pose().$name] || HURT_FALLBACK;
    const sc = this.scale, fx = this.facing;
    const wx = this.px, wy = GROUND_Y - this.py;
    const out = [];
    for (const b of spec){
      out.push({
        x: fx > 0 ? wx + b[0] * sc : wx - (b[0] + b[2]) * sc,
        y: wy + b[1] * sc,
        w: b[2] * sc,
        h: b[3] * sc + b[4]
      });
    }
    return out;
  }
  hitBox(){
    const m = this.move;
    if (!m || !m.hit) return null;
    const f = this.stateFrame;
    if (f < m.startup || f >= m.startup + m.active) return null;
    if (this.hitCount >= m.maxHits) return null;
    const sc = this.scale, wx = this.px, wy = GROUND_Y - this.py;
    const h = m.hit;
    const x = this.facing > 0 ? wx + h.x * sc : wx - (h.x + h.w) * sc;
    return { x, y: wy + h.y * sc, w: h.w * sc, h: h.h * sc };
  }
  isInvulnerable(){
    if (this.invuln > 0) return true;
    if (this.state === S.ATTACK && this.move && this.stateFrame < this.move.invuln) return true;
    return false;
  }
  canAct(){
    return this.state === S.IDLE || this.state === S.WALKF || this.state === S.WALKB ||
           this.state === S.CROUCH || this.state === S.JUMP;
  }
  addMeter(v){ this.meter = clamp(this.meter + v, 0, METER_MAX); }
}

/* --- move selection ------------------------------------------------------- */

function pickSpecial(f, pressed){
  const ch = f.ch;
  if (f.meter >= METER_MAX && ch.super.check(f.mb, pressed))
    return { move: ch.superMove, superMove: true };
  for (const s of ch.specials){
    if (!s.check(f.mb, pressed)) continue;
    const btn = BUTTON_LIST.find(b => pressed & b) || IN_LP;
    if (s.charge) f.mb.consumeCharge(s.charge);
    return { move: ch.spMoves[s.key][btn], superMove: false };
  }
  return null;
}
function pickNormal(f, pressed){
  const stance = f.airborne ? "air" : f.crouching ? "crouch" : "stand";
  const table = NORMAL_TABLE[stance];
  for (const b of BUTTON_LIST) if (pressed & b){
    const key = table[b];
    if (key) return NORMALS[key];
  }
  return null;
}
function startMove(f, m, isSuper){
  f.move = m; f.moveId = m.num;
  f.setState(S.ATTACK, null);
  f.hitDone.clear(); f.hitCount = 0; f.rehitTimer = 0;
  f.cancelOk = false;
  if (isSuper) f.meter = 0;
}

/* ============================================================================
   THE SIMULATION
   ----------------------------------------------------------------------------
   One `step()` is exactly one 60Hz frame and touches only integers, so two
   machines running the same inputs produce byte-identical state. Anything
   cosmetic (camera, sparks, screen shake) is derived here too, but is never
   allowed to feed back into the numbers the checksum covers.
   ========================================================================== */

const PH = { INTRO:0, FIGHT:1, KO:2, ROUNDEND:3, MATCHEND:4 };
const ROUND_FRAMES = 99 * 60;
const WINS_NEEDED   = 2;

class Game {
  constructor(charKeys, seed){
    this.seed = seed >>> 0;
    this.rng = makeRNG(this.seed);
    this.fighters = [ new Fighter(CHAR_BY_KEY[charKeys[0]], 0),
                      new Fighter(CHAR_BY_KEY[charKeys[1]], 1) ];
    this.stage = this.fighters[0].ch.stageKey;
    this.round = 1; this.matchOver = false; this.matchWinner = -1;
    this.frame = 0;
    this.effects = []; this.projectiles = [];
    this.camX = (STAGE_W - W) / 2; this.shake = 0;
    this.announce = ""; this.announceT = 0;
    this.startRound(true);
  }
  startRound(full){
    const mid = STAGE_W / 2;
    this.fighters[0].reset(mid - 52, 1, full);
    this.fighters[1].reset(mid + 52, -1, full);
    if (!full) for (const f of this.fighters) f.hp = f.maxHp;   /* meter carries over */
    this.projectiles.length = 0; this.effects.length = 0;
    this.timer = ROUND_FRAMES;
    this.phase = PH.INTRO; this.phaseTimer = 0;
    this.hitstop = 0; this.koSide = -1;
    this.setAnnounce("ROUND " + this.round, 70);
  }
  setAnnounce(t, dur){ this.announce = t; this.announceT = dur; }
  fx(type, x, y, extra){
    const e = Object.assign({ type, x, y, t:0, life:14 }, extra||{});
    this.effects.push(e);
    if (this.effects.length > 60) this.effects.shift();
  }

  /* ---------------------------------------------------------------- step -- */
  step(inputs){
    this.frame++;
    if (this.announceT > 0) this.announceT--;
    if (this.shake > 0) this.shake--;

    if (this.hitstop > 0){
      this.hitstop--;
      /* Freeze frames stop the action, not the controller. Inputs made during
         hitstop are still read and buffered, which is exactly how you confirm
         a hit and cancel the normal into a special. */
      for (let i = 0; i < 2; i++) this.bufferInput(this.fighters[i], inputs[i]|0);
      this.updateEffects();
      this.updateCamera();
      return;
    }

    if (this.phase === PH.INTRO){
      this.phaseTimer++;
      if (this.phaseTimer === 72) this.setAnnounce("FIGHT!", 46);
      if (this.phaseTimer >= 100){
        this.phase = PH.FIGHT;
        for (const f of this.fighters) f.setState(S.IDLE, ANIM.idle);
      }
      for (const f of this.fighters){ f.animFrame++; }
      this.updateCamera();
      return;
    }

    if (this.phase === PH.FIGHT){
      for (let i = 0; i < 2; i++)
        this.updateFighter(this.fighters[i], this.fighters[1-i], inputs[i]|0);
      this.physics();
      this.separate();
      this.updateProjectiles();
      this.detectHits();
      for (const f of this.fighters){ f.stateFrame++; f.animFrame++; if (f.invuln > 0) f.invuln--; if (f.flash > 0) f.flash--;
        if (f.comboTimer > 0){ f.comboTimer--; if (f.comboTimer === 0) f.comboHits = 0; }
        if (f.comboShowT > 0) f.comboShowT--; }
      this.timer--;
      this.checkRoundEnd();
    }
    else if (this.phase === PH.KO || this.phase === PH.ROUNDEND || this.phase === PH.MATCHEND){
      this.phaseTimer++;
      for (let i = 0; i < 2; i++) this.updateFighter(this.fighters[i], this.fighters[1-i], 0);
      this.physics();
      this.separate();
      this.updateProjectiles();
      for (const f of this.fighters){ f.stateFrame++; f.animFrame++; if (f.flash > 0) f.flash--; }
      if (this.phase === PH.KO && this.phaseTimer > 96) this.finishRound();
      if (this.phase === PH.ROUNDEND && this.phaseTimer > 150) this.startRound(false);
    }
    this.updateEffects();
    this.updateCamera();
  }

  /* ------------------------------------------------------------- fighters -- */
  /* Read a frame of input without advancing the game: used during hitstop. */
  bufferInput(f, input){
    f.prevIn = f.curIn; f.curIn = input;
    f.pressBuf |= (input & ~f.prevIn) & BUTTONS;
    f.mb.push(numpadDir(input, f.facing));
  }
  updateFighter(f, opp, input){
    f.prevIn = f.curIn; f.curIn = input;
    const pressed = (input & ~f.prevIn) | f.pressBuf;
    f.pressBuf = 0;

    /* Face the opponent whenever you are free to move — never mid-move. */
    if (!f.airborne && f.canAct() && f.px !== opp.px)
      f.facing = opp.px > f.px ? 1 : -1;
    f.mb.push(numpadDir(input, f.facing));

    switch (f.state){
      case S.HITSTUN:
        if (--f.hitstun <= 0 && !f.airborne) f.setState(S.IDLE, ANIM.idle);
        break;
      case S.BLOCKSTUN:
        if (--f.blockstun <= 0) f.setState(S.IDLE, ANIM.idle);
        break;
      case S.KNOCKDOWN:
        if (!f.airborne){
          if (--f.downTimer <= 0){ f.setState(S.GETUP, ANIM.getup); f.invuln = 16; }
        }
        break;
      case S.GETUP:
        if (f.stateFrame >= 14) f.setState(S.IDLE, ANIM.idle);
        break;
      case S.THROWN:
        if (f.stateFrame >= 18){ f.setState(S.KNOCKDOWN, ANIM.fall); f.downTimer = 30; f.airborne = false; }
        break;
      case S.LAND:
        if (f.stateFrame >= 4) f.setState(S.IDLE, ANIM.idle);
        break;
      case S.WIN: case S.DEFEAT: case S.INTRO:
        break;
      case S.ATTACK:
        this.advanceAttack(f, opp, input, pressed);
        break;
      default:
        this.freeActions(f, opp, input, pressed);
    }
  }

  freeActions(f, opp, input, pressed){
    const fwd  = f.facing > 0 ? IN_RIGHT : IN_LEFT;
    const back = f.facing > 0 ? IN_LEFT  : IN_RIGHT;
    f.crouching = !f.airborne && !!(input & IN_DOWN);
    f.guarding  = !f.airborne && !!(input & back);

    if (pressed & BUTTONS){
      /* Throw: light punch and light kick together, in range, on the floor. */
      const lightPair = (pressed & (IN_LP|IN_LK)) && (input & IN_LP) && (input & IN_LK);
      if (lightPair && !f.airborne && !f.crouching &&
          Math.abs(f.px - opp.px) < 46 * f.scale && !opp.airborne){
        startMove(f, NORMALS.throwAttempt, false);
        return;
      }
      const spec = pickSpecial(f, pressed);
      if (spec){ startMove(f, spec.move, spec.superMove); Sfx.play(spec.superMove ? "super" : "whiff"); return; }
      const nrm = pickNormal(f, pressed);
      if (nrm){ startMove(f, nrm, false); Sfx.play("whiff"); return; }
    }

    if (f.airborne){ f.setAnim(f.vy > 0 ? ANIM.jumpRise : ANIM.jumpFall); return; }

    if (input & IN_UP){
      const dir = (input & fwd) ? 1 : (input & back) ? -1 : 0;
      f.vy = f.ch.jumpV;
      f.vx = dir * f.facing * f.ch.jumpX;
      f.airborne = true; f.jumpDir = dir;
      f.setState(S.JUMP, ANIM.jumpRise);
      Sfx.play("jump");
      this.fx("dust", f.px, GROUND_Y, { life: 12 });
      return;
    }
    if (input & IN_DOWN){ f.vx = 0; f.setState(S.CROUCH, ANIM.crouch); return; }
    if (input & fwd){ f.vx = f.facing * f.ch.walkF; if (f.state !== S.WALKF) f.setState(S.WALKF, ANIM.walkF); return; }
    if (input & back){ f.vx = -f.facing * f.ch.walkB; if (f.state !== S.WALKB) f.setState(S.WALKB, ANIM.walkB); return; }
    f.vx = 0;
    if (f.state !== S.IDLE) f.setState(S.IDLE, ANIM.idle);
  }

  advanceAttack(f, opp, input, pressed){
    const m = f.move;
    if (!m){ f.setState(S.IDLE, ANIM.idle); return; }

    if (f.rehitTimer > 0){
      f.rehitTimer--;
      if (f.rehitTimer === 0 && f.hitCount < m.maxHits) f.hitDone.clear();
    }
    /* Impulses and projectiles fire on the first active frame. */
    if (f.stateFrame === m.startup){
      if (m.moveY){ f.vy = m.moveY; f.airborne = true; }
      if (m.moveX) f.vx = f.facing * m.moveX;
      if (m.proj) this.spawnProjectile(f, m);
    }
    /* Cancel a connected normal into a special or super, the way chains work
       in the arcade games: only after it touched something. */
    if (f.cancelOk && m.cancelable && (pressed & BUTTONS) && f.stateFrame >= m.startup){
      const spec = pickSpecial(f, pressed);
      if (spec){ startMove(f, spec.move, spec.superMove); Sfx.play(spec.superMove ? "super" : "whiff"); return; }
    }
    if (f.stateFrame >= m.total){
      f.move = null; f.moveId = 0;
      if (f.airborne) f.setState(S.JUMP, ANIM.jumpFall);
      else f.setState(S.IDLE, ANIM.idle);
    }
  }

  /* -------------------------------------------------------------- physics -- */
  physics(){
    for (const f of this.fighters){
      if (f.airborne){
        f.vy -= GRAVITY;
        f.y += f.vy;
        if (f.y <= 0){
          f.y = 0; f.vy = 0; f.airborne = false;
          this.onLand(f);
        }
      } else {
        f.y = 0;
        /* ground friction: walking overwrites vx anyway, so this only decays
           knockback and the momentum of rushing specials */
        if (f.state !== S.WALKF && f.state !== S.WALKB){
          if (f.vx > 0) f.vx = Math.max(0, f.vx - 46);
          else if (f.vx < 0) f.vx = Math.min(0, f.vx + 46);
        }
      }
      f.x += f.vx;
      const half = f.pushHalf;
      if (f.x < half){ f.x = half; if (f.vx < 0) f.vx = 0; }
      if (f.x > STAGE_W*FP - half){ f.x = STAGE_W*FP - half; if (f.vx > 0) f.vx = 0; }
    }
  }
  onLand(f){
    this.fx("dust", f.px, GROUND_Y, { life: 12 });
    if (f.state === S.HITSTUN || f.state === S.KNOCKDOWN){
      f.setState(S.KNOCKDOWN, ANIM.down);
      f.downTimer = 30; f.vx = 0;
      Sfx.play("thud"); this.shake = Math.max(this.shake, 6);
    } else if (f.state === S.ATTACK){
      f.move = null; f.moveId = 0;
      f.setState(S.LAND, ANIM.land);
    } else {
      f.setState(S.LAND, ANIM.land);
      Sfx.play("land");
    }
  }
  separate(){
    const [a, b] = this.fighters;
    if (a.state === S.KNOCKDOWN || b.state === S.KNOCKDOWN) return;
    const minD = a.pushHalf + b.pushHalf;
    let d = b.x - a.x;
    const s = d >= 0 ? 1 : -1;
    if (Math.abs(d) >= minD) return;
    const push = minD - Math.abs(d);
    const halfPush = (push >> 1) + 1;
    a.x -= s * halfPush; b.x += s * halfPush;
    for (const f of this.fighters){
      const half = f.pushHalf;
      if (f.x < half) f.x = half;
      if (f.x > STAGE_W*FP - half) f.x = STAGE_W*FP - half;
    }
    /* If one fighter is jammed into a wall, the other eats the whole push. */
    let d2 = b.x - a.x;
    if (Math.abs(d2) < minD){
      const short = minD - Math.abs(d2);
      if (a.x <= a.pushHalf) b.x += s * short;
      else if (b.x >= STAGE_W*FP - b.pushHalf) a.x -= s * short;
    }
  }
  updateCamera(){
    const [a, b] = this.fighters;
    const mid = (a.px + b.px) / 2;
    let target = clamp(mid - W/2, 0, STAGE_W - W);
    this.camX += (target - this.camX) * 0.18;
    if (Math.abs(this.camX - target) < 0.4) this.camX = target;
  }

  /* ---------------------------------------------------------- projectiles -- */
  spawnProjectile(f, m){
    const p = m.proj;
    const single = p.kind !== "tempest";
    if (single && f.projCount > 0) return;      /* one fireball at a time */
    if (single) f.projCount++;
    this.projectiles.push({
      owner: f.id, single, kind: p.kind, facing: f.facing,
      x: f.x + f.facing * Math.round(p.ox * f.scale) * FP,
      y: Math.round(-p.oy * f.scale) * FP,
      vx: f.facing * p.vx,
      w: p.w, h: p.h, dmg: p.dmg, chip: p.chip,
      hitstun: p.hitstun, blockstun: p.blockstun, pushHit: p.pushHit || 480,
      hits: p.hits || 1, hitDone: new Set(), rehit: 0, life: 240, t: 0
    });
    Sfx.play("fire");
  }
  projBox(pr){
    return { x: pr.x/FP - pr.w/2, y: GROUND_Y - pr.y/FP - pr.h/2, w: pr.w, h: pr.h };
  }
  killProjectile(pr, i){
    if (pr.single) this.fighters[pr.owner].projCount = Math.max(0, this.fighters[pr.owner].projCount - 1);
    this.projectiles.splice(i, 1);
  }
  updateProjectiles(){
    for (let i = this.projectiles.length - 1; i >= 0; i--){
      const pr = this.projectiles[i];
      pr.x += pr.vx; pr.t++;
      if (pr.rehit > 0 && --pr.rehit === 0) pr.hitDone.clear();
      const px = pr.x / FP;
      if (--pr.life <= 0 || px < -30 || px > STAGE_W + 30){ this.killProjectile(pr, i); continue; }
    }
    /* Opposing projectiles trade and both disappear — the classic fireball war. */
    for (let i = this.projectiles.length - 1; i >= 0; i--){
      for (let j = i - 1; j >= 0; j--){
        const a = this.projectiles[i], b = this.projectiles[j];
        if (!a || !b || a.owner === b.owner) continue;
        if (boxOverlap(this.projBox(a), this.projBox(b))){
          this.fx("spark", (a.x + b.x)/(2*FP), GROUND_Y - a.y/FP, { life: 14, big: true });
          Sfx.play("clash");
          this.killProjectile(a, i); this.killProjectile(b, j);
          break;
        }
      }
    }
  }

  /* --------------------------------------------------------------- combat -- */
  detectHits(){
    /* melee */
    for (let i = 0; i < 2; i++){
      const a = this.fighters[i], d = this.fighters[1-i];
      if (a.state !== S.ATTACK || !a.move) continue;
      const hb = a.hitBox();
      if (!hb || a.hitDone.has(d.id)) continue;
      if (d.isInvulnerable()) continue;
      if (this.overlapsFighter(hb, d)) this.resolveHit(a, d, a.move, null);
    }
    /* projectiles */
    for (let i = this.projectiles.length - 1; i >= 0; i--){
      const pr = this.projectiles[i];
      const d = this.fighters[1 - pr.owner];
      if (pr.hitDone.has(d.id) || d.isInvulnerable()) continue;
      if (this.overlapsFighter(this.projBox(pr), d)){
        const fake = { level:"mid", dmg:pr.dmg, chip:pr.chip, hitstun:pr.hitstun,
                       blockstun:pr.blockstun, pushHit:pr.pushHit, pushBlock:300,
                       launch:0, knockdown:false, type:"projectile",
                       meterHit:20, meterBlock:8, sfx:"hit" };
        this.resolveHit(this.fighters[pr.owner], d, fake, pr);
        pr.hitDone.add(d.id);
        if (--pr.hits <= 0) this.killProjectile(pr, i);
        else pr.rehit = 6;
      }
    }
  }
  overlapsFighter(box, f){
    for (const hb of f.hurtBoxes()) if (boxOverlap(box, hb)) return true;
    return false;
  }
  scaledDamage(base, comboHits){
    const scale = comboHits <= 1 ? 100 : comboHits === 2 ? 88 : comboHits === 3 ? 74 : comboHits === 4 ? 60 : 45;
    return Math.max(1, Math.floor(base * scale / 100));
  }
  resolveHit(a, d, m, pr){
    const dir = pr ? sign(pr.vx) : a.facing;
    const cx = (a.px + d.px) / 2;
    const cy = GROUND_Y - (d.py + 44 * d.scale);

    /* Throws ignore guard entirely, but cannot catch an airborne or downed
       opponent — the standard rule, and what makes them a read, not a mash. */
    if (m.level === "throw"){
      if (d.airborne || d.state === S.KNOCKDOWN || d.state === S.THROWN) return;
      a.hitDone.add(d.id); a.hitCount++;
      const dmg = this.scaledDamage(m.dmg, 1);
      d.hp = Math.max(0, d.hp - dmg);
      d.setState(S.THROWN, ANIM.fall);
      d.airborne = true; d.vy = 820; d.vx = -a.facing * 620;
      d.facing = -a.facing; d.flash = 6;
      d.comboHits = 0; a.comboShow = 0; a.comboShowT = 0;
      a.addMeter(m.meterHit); d.addMeter(14);
      this.hitstop = 12; this.shake = 8;
      this.fx("spark", cx, cy, { big:true, life:16 });
      Sfx.play("throw");
      this.afterDamage(d);
      return;
    }

    const canBlock =
      d.guarding && !d.airborne &&
      d.state !== S.ATTACK && d.state !== S.HITSTUN && d.state !== S.KNOCKDOWN &&
      (m.level === "mid" ||
       (m.level === "low"      &&  d.crouching) ||
       (m.level === "overhead" && !d.crouching));

    if (!pr){ a.hitDone.add(d.id); a.hitCount++; a.rehitTimer = m.rehit || 0; }
    a.cancelOk = true;

    if (canBlock){
      const chip = m.chip && (m.type === "special" || m.type === "super" || m.type === "projectile")
        ? Math.max(1, m.chip) : 0;
      if (chip) d.hp = Math.max(0, d.hp - chip);
      d.setState(S.BLOCKSTUN, d.crouching ? ANIM.blockLo : ANIM.blockHi);
      d.blockstun = m.blockstun;
      d.vx = -dir * (m.pushBlock || 320);
      a.vx = a.airborne ? a.vx : a.facing * -Math.round((m.pushBlock || 320) * 0.35);
      a.addMeter(m.meterBlock); d.addMeter(Math.round(m.meterBlock * 1.4));
      this.hitstop = 6;
      this.fx("guard", d.px + d.facing * 16, cy, { life: 12 });
      Sfx.play("block");
      this.afterDamage(d);
      return;
    }

    /* clean hit */
    d.comboTimer = 60;
    d.comboHits = Math.min(d.comboHits + 1, 9);
    a.comboShow = d.comboHits; a.comboShowT = 74;
    const dmg = this.scaledDamage(m.dmg, d.comboHits);
    d.hp = Math.max(0, d.hp - dmg);
    d.flash = 5;
    d.hitstun = m.hitstun;
    a.addMeter(m.meterHit); d.addMeter(Math.round(m.meterHit * 0.5));

    const heavy = m.dmg >= 15 || m.knockdown;
    this.hitstop = heavy ? 11 : 6;
    this.shake = Math.max(this.shake, heavy ? 6 : 3);

    if (m.knockdown || m.launch || d.airborne){
      d.setState(S.KNOCKDOWN, d.airborne ? ANIM.hitAir : ANIM.fall);
      d.airborne = true;
      d.vy = Math.max(m.launch || 0, 720);
      d.vx = -dir * (m.pushHit || 600);
    } else {
      const low = m.level === "low";
      d.setState(S.HITSTUN, low ? ANIM.hitLo : ANIM.hitHi);
      d.vx = -dir * (m.pushHit || 520);
    }
    this.fx("spark", cx, cy, { big: heavy, life: heavy ? 16 : 12 });
    Sfx.play(heavy ? "heavy" : (m.sfx === "kick" ? "kick" : "hit"));
    this.afterDamage(d);
  }
  afterDamage(d){
    if (d.hp <= 0 && this.phase === PH.FIGHT) this.triggerKO(1 - d.id);
  }

  /* ----------------------------------------------------------- round flow -- */
  triggerKO(winner){
    this.phase = PH.KO; this.phaseTimer = 0; this.koSide = winner;
    this.hitstop = 16; this.shake = 12;
    const loser = this.fighters[1 - winner];
    loser.setState(S.KNOCKDOWN, ANIM.fall);
    loser.airborne = true; loser.vy = 880; loser.vx = -this.fighters[winner].facing * 700;
    this.setAnnounce("K.O.", 120);
    Sfx.play("ko");
  }
  checkRoundEnd(){
    if (this.timer <= 0){
      const [a, b] = this.fighters;
      const pa = a.hp / a.maxHp, pb = b.hp / b.maxHp;
      this.phase = PH.KO; this.phaseTimer = 0;
      this.koSide = pa === pb ? -1 : (pa > pb ? 0 : 1);
      if (this.koSide >= 0){
        const loser = this.fighters[1 - this.koSide];
        loser.setState(S.KNOCKDOWN, ANIM.fall);
        loser.airborne = true; loser.vy = 700;
      }
      this.setAnnounce("TIME UP", 120);
      Sfx.play("ko");
    }
  }
  finishRound(){
    const w = this.koSide;
    if (w >= 0){
      const winner = this.fighters[w];
      winner.wins++;
      winner.setState(S.WIN, ANIM.win);
      const perfect = winner.hp === winner.maxHp;
      if (winner.wins >= WINS_NEEDED){
        this.matchOver = true; this.matchWinner = w;
        this.phase = PH.MATCHEND; this.phaseTimer = 0;
        this.setAnnounce(winner.ch.name.toUpperCase() + " WINS", 600);
        Sfx.play("win");
        return;
      }
      this.setAnnounce(perfect ? "PERFECT" : winner.ch.name.toUpperCase() + " WINS", 140);
    } else {
      this.setAnnounce("DRAW", 140);
    }
    /* Both fighters at two wins each would be a draw game; capped at 3 rounds. */
    this.round++;
    if (this.round > 3){
      this.matchOver = true;
      this.matchWinner = this.fighters[0].wins === this.fighters[1].wins ? -1 :
                         (this.fighters[0].wins > this.fighters[1].wins ? 0 : 1);
      this.phase = PH.MATCHEND; this.phaseTimer = 0;
      this.setAnnounce(this.matchWinner < 0 ? "DRAW GAME" :
        this.fighters[this.matchWinner].ch.name.toUpperCase() + " WINS", 600);
      return;
    }
    this.phase = PH.ROUNDEND; this.phaseTimer = 0;
  }

  updateEffects(){
    for (let i = this.effects.length - 1; i >= 0; i--){
      const e = this.effects[i];
      if (++e.t >= e.life) this.effects.splice(i, 1);
    }
  }
}

/* ============================================================================
   SOUND
   ----------------------------------------------------------------------------
   Everything is synthesised with WebAudio — no audio files, so the page stays
   a single self-contained document.
   ========================================================================== */

const Sfx = {
  ctx:null, master:null, muted:false, noise:null,
  unlock(){
    if (this.ctx){ if (this.ctx.state === "suspended") this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.32;
    this.master.connect(this.ctx.destination);
    const len = this.ctx.sampleRate * 0.5;
    this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const data = this.noise.getChannelData(0);
    let seed = 22222;
    for (let i = 0; i < len; i++){ seed = (Math.imul(seed, 1103515245) + 12345) >>> 0; data[i] = (seed / 2147483648) - 1; }
  },
  tone(freq, dur, type, vol, slideTo){
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || "square"; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
    g.gain.setValueAtTime(vol == null ? 0.3 : vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },
  burst(dur, vol, lp){
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const g = this.ctx.createGain(), f = this.ctx.createBiquadFilter();
    f.type = "lowpass"; f.frequency.setValueAtTime(lp || 2600, t);
    f.frequency.exponentialRampToValueAtTime(Math.max(120, (lp||2600) * 0.25), t + dur);
    g.gain.setValueAtTime(vol == null ? 0.3 : vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t); src.stop(t + dur + 0.02);
  },
  play(name){
    if (!this.ctx || this.muted) return;
    switch (name){
      case "whiff":  this.burst(0.07, 0.10, 2200); break;
      case "hit":    this.burst(0.09, 0.34, 2000); this.tone(190, 0.07, "square", 0.16, 90); break;
      case "kick":   this.burst(0.10, 0.32, 1500); this.tone(150, 0.08, "square", 0.16, 70); break;
      case "heavy":  this.burst(0.17, 0.46, 1100); this.tone(110, 0.14, "square", 0.24, 45); break;
      case "sweep":  this.burst(0.13, 0.34, 900);  break;
      case "block":  this.burst(0.07, 0.24, 5200); this.tone(760, 0.05, "square", 0.10, 520); break;
      case "fire":   this.tone(340, 0.24, "sawtooth", 0.20, 900); this.burst(0.20, 0.14, 3200); break;
      case "clash":  this.tone(880, 0.20, "square", 0.22, 220); this.burst(0.16, 0.24, 5000); break;
      case "jump":   this.tone(260, 0.10, "square", 0.11, 480); break;
      case "land":   this.burst(0.06, 0.14, 900); break;
      case "thud":   this.burst(0.22, 0.42, 620); this.tone(70, 0.20, "sine", 0.30, 40); break;
      case "throw":  this.burst(0.20, 0.40, 800); this.tone(150, 0.18, "square", 0.24, 60); break;
      case "super":  this.tone(220, 0.5, "sawtooth", 0.22, 1400); this.burst(0.5, 0.16, 4000); break;
      case "ko":     this.tone(300, 0.7, "square", 0.28, 60); this.burst(0.5, 0.24, 900); break;
      case "win":    [523,659,784,1047].forEach((f,i)=>setTimeout(()=>this.tone(f,0.20,"square",0.20),i*110)); break;
      case "select": this.tone(700, 0.05, "square", 0.16, 1100); break;
      case "round":  this.tone(440, 0.16, "square", 0.20, 660); break;
    }
  },
  toggleMute(){ this.muted = !this.muted; return this.muted; }
};

/* ============================================================================
   RENDERING
   ========================================================================== */

const screen = document.getElementById("screen");
const sctx = screen.getContext("2d");
sctx.imageSmoothingEnabled = false;

/* Health bars lag behind real damage, so a big combo reads as one long
   drain rather than an instant jump. Purely presentational. */
const hud = [ { trail:1, hp:1 }, { trail:1, hp:1 } ];

function drawBar(ctx, x, y, w, h, frac, trail, flip, color){
  ctx.fillStyle = "#14141f"; ctx.fillRect(x-2, y-2, w+4, h+4);
  ctx.fillStyle = "#2c2c3c"; ctx.fillRect(x, y, w, h);
  const tw = Math.round(w * clamp(trail,0,1)), fw = Math.round(w * clamp(frac,0,1));
  const tx = flip ? x + w - tw : x, fx = flip ? x + w - fw : x;
  ctx.fillStyle = "#ffcf5c"; ctx.fillRect(tx, y, tw, h);
  ctx.fillStyle = color;      ctx.fillRect(fx, y, fw, h);
  ctx.fillStyle = "rgba(255,255,255,.28)"; ctx.fillRect(fx, y, fw, 2);
  ctx.fillStyle = "rgba(0,0,0,.28)";       ctx.fillRect(fx, y + h - 2, fw, 2);
}

function drawEffect(ctx, e, camX){
  const x = Math.round(e.x - camX), y = Math.round(e.y), p = e.t / e.life;
  if (e.type === "spark"){
    const r = (e.big ? 15 : 9) * (0.4 + p * 1.5);
    const cols = ["#ffffff","#ffe98a","#ffb03a","#ff6a2a"];
    const c = cols[Math.min(3, Math.floor(p * 4))];
    ctx.fillStyle = c;
    for (let i = 0; i < 8; i++){
      const a = i * Math.PI / 4;
      const px = Math.round(x + Math.cos(a) * r), py = Math.round(y + Math.sin(a) * r);
      const s = e.big ? 4 : 3;
      ctx.fillRect(px - (s>>1), py - (s>>1), s, s);
    }
    if (p < 0.5){ ctx.fillStyle = "#fff"; const s = e.big ? 10 : 6; ctx.fillRect(x - (s>>1), y - (s>>1), s, s); }
  } else if (e.type === "guard"){
    ctx.fillStyle = p < 0.5 ? "#bfe9ff" : "#5aa8e0";
    const r = 8 + p * 10;
    for (let i = -2; i <= 2; i++){
      const a = i * 0.35;
      ctx.fillRect(Math.round(x + Math.cos(a) * r), Math.round(y + Math.sin(a) * r * 1.6), 3, 3);
    }
  } else if (e.type === "dust"){
    ctx.fillStyle = "rgba(220,215,200," + (1 - p).toFixed(2) + ")";
    const r = 3 + p * 12;
    for (const s of [-1, 1]){
      ctx.fillRect(Math.round(x + s * r), Math.round(y - 2 - p * 3), 3, 2);
      ctx.fillRect(Math.round(x + s * r * 0.6), Math.round(y - 4 - p * 5), 2, 2);
    }
  }
}

function drawProjectile(ctx, pr, camX, frame){
  const x = Math.round(pr.x/FP - camX), y = Math.round(GROUND_Y - pr.y/FP);
  const ph = (frame >> 2) % 3;
  if (pr.kind === "bolt"){
    ctx.fillStyle = "#14141f"; ctx.fillRect(x-10, y-8, 20, 16);
    ctx.fillStyle = "#2e6ad0"; ctx.fillRect(x-9, y-7, 18, 14);
    ctx.fillStyle = "#7fd8ff"; ctx.fillRect(x-6, y-5, 12, 10);
    ctx.fillStyle = "#eaffff"; ctx.fillRect(x-3+ph-1, y-3, 6, 6);
    ctx.fillStyle = "rgba(127,216,255,.5)";
    ctx.fillRect(x - pr.facing*16, y-2, 10, 4);
  } else if (pr.kind === "lance"){
    ctx.fillStyle = "#14141f"; ctx.fillRect(x-12, y-6, 24, 12);
    ctx.fillStyle = "#7d3ce0"; ctx.fillRect(x-11, y-5, 22, 10);
    ctx.fillStyle = "#25f0d0"; ctx.fillRect(x-8, y-3, 16, 6);
    ctx.fillStyle = "#eaffff"; ctx.fillRect(x + pr.facing*4, y-2, 6, 4);
    ctx.fillStyle = "rgba(37,240,208,.45)"; ctx.fillRect(x - pr.facing*22, y-1, 14, 2);
  } else { /* tempest */
    for (let i = 3; i >= 0; i--){
      const s = 8 + i * 5 + (ph*2);
      ctx.fillStyle = ["#eaffff","#a8e8ff","#4da2ff","#1c3fb0"][i];
      ctx.fillRect(x - s, y - s + 2, s*2, s*2 - 4);
    }
  }
}

function drawFighter(ctx, f, camX, opp){
  const pose = f.pose();
  const tint = f.flash > 0 ? "flash" : null;
  const spr = getSprite(f.ch, pose, f.facing, tint);
  const x = Math.round(f.px - camX) - SPRITE_OX;
  const y = Math.round(GROUND_Y - f.py) - SPRITE_OY;
  /* contact shadow, squashed by height off the floor */
  const alt = f.py;
  const sw = Math.max(10, Math.round(30 * f.scale - alt * 0.16));
  ctx.fillStyle = "rgba(0,0,0,.34)";
  ctx.fillRect(Math.round(f.px - camX) - (sw>>1), GROUND_Y - 2, sw, 4);
  ctx.drawImage(spr, x, y);
  /* super-meter-full aura */
  if (f.meter >= METER_MAX && f.state !== S.KNOCKDOWN){
    ctx.globalAlpha = 0.30 + 0.14 * Math.sin(f.animFrame * 0.3);
    ctx.drawImage(getSprite(f.ch, pose, f.facing, "flash"), x, y - 1);
    ctx.globalAlpha = 1;
  }
  void opp;
}

function drawHUD(ctx, g){
  const [a, b] = g.fighters;
  const barW = 150, barH = 11;
  for (let i = 0; i < 2; i++){
    const f = g.fighters[i];
    const target = f.hp / f.maxHp;
    hud[i].hp = target;
    if (hud[i].trail > target) hud[i].trail = Math.max(target, hud[i].trail - 0.006);
    else hud[i].trail = target;
    const x = i === 0 ? 12 : W - 12 - barW;
    drawBar(ctx, x, 12, barW, barH, target, hud[i].trail, i === 1, i === 0 ? "#e04a4a" : "#4a9ae0");
    drawText(ctx, f.ch.name, i === 0 ? x : x + barW - textWidth(f.ch.name), 27, "#e8e6f0", 1);
    /* round pips */
    for (let r = 0; r < WINS_NEEDED; r++){
      const px = i === 0 ? x + r*9 : x + barW - 6 - r*9;
      ctx.fillStyle = "#14141f"; ctx.fillRect(px-1, 36, 8, 8);
      ctx.fillStyle = r < f.wins ? "#ffcc33" : "#33334a"; ctx.fillRect(px, 37, 6, 6);
    }
    /* super meter */
    const mx = i === 0 ? 12 : W - 12 - 96;
    const frac = f.meter / METER_MAX;
    ctx.fillStyle = "#14141f"; ctx.fillRect(mx-1, H-16, 98, 9);
    ctx.fillStyle = "#22223a"; ctx.fillRect(mx, H-15, 96, 7);
    const mw = Math.round(96 * frac);
    ctx.fillStyle = frac >= 1 ? (((g.frame>>2)&1) ? "#fff3a0" : "#ffcc33") : f.ch.pal.glow;
    ctx.fillRect(i === 0 ? mx : mx + 96 - mw, H-15, mw, 7);
    drawText(ctx, frac >= 1 ? "SUPER" : "METER", i === 0 ? mx : mx + 96 - textWidth("METER"), H-26,
             frac >= 1 ? "#ffcc33" : "#6a6a86", 1);
  }
  /* timer */
  const secs = Math.max(0, Math.ceil(g.timer / 60));
  const ts = (secs < 10 ? "0" : "") + secs;
  ctx.fillStyle = "#14141f"; ctx.fillRect(W/2 - 22, 8, 44, 26);
  ctx.fillStyle = "#22223a"; ctx.fillRect(W/2 - 20, 10, 40, 22);
  drawTextC(ctx, ts, W/2, 13, secs <= 10 ? "#ff5a5a" : "#ffcc33", 2, 2);

  /* combo counter */
  for (let i = 0; i < 2; i++){
    const f = g.fighters[i];
    if (f.comboShow >= 2 && f.comboShowT > 0){
      const x = i === 0 ? 16 : W - 90;
      drawTextShadow(ctx, f.comboShow + " HIT", x, 52, "#ffcc33", "#14141f", 1);
    }
  }
  void a; void b;
}

function render(g){
  const st = stageFor(g.stage);
  const shakeX = g.shake > 0 ? ((g.frame % 2) ? g.shake : -g.shake) >> 1 : 0;
  const shakeY = g.shake > 0 ? ((g.frame % 3) ? 1 : -1) * (g.shake >> 2) : 0;
  const camX = g.camX;

  sctx.save();
  sctx.translate(shakeX, shakeY);
  sctx.fillStyle = "#05060f"; sctx.fillRect(-8, -8, W+16, H+16);
  sctx.drawImage(st.far,  Math.round(-camX * 0.25), 0);
  sctx.drawImage(st.near, Math.round(-camX * 0.55), 0);
  sctx.drawImage(st.floor, Math.round(-camX), GROUND_Y - 2);

  const order = g.fighters[0].state === S.ATTACK ? [1,0] : [0,1];
  for (const i of order) drawFighter(sctx, g.fighters[i], camX, g.fighters[1-i]);
  for (const pr of g.projectiles) drawProjectile(sctx, pr, camX, g.frame);
  for (const e of g.effects) drawEffect(sctx, e, camX);
  sctx.restore();

  drawHUD(sctx, g);

  if (g.announceT > 0 && g.announce){
    const t = g.announce;
    const sc = t.length > 9 ? 2 : 3;
    const y = 76;
    drawTextC(sctx, t, W/2 + 2, y + 2, "#000", sc, 2);
    drawTextC(sctx, t, W/2, y, "#ffcc33", sc, 2);
  }
}

/* ============================================================================
   CPU OPPONENT
   ----------------------------------------------------------------------------
   The AI does not reach into the simulation; it only produces the same input
   bitmask a human would, one frame at a time. Motion inputs are queued out
   frame by frame, so the CPU has to execute a quarter-circle just like you do.
   ========================================================================== */

const AI_LEVELS = {
  easy:   { react: 16, block: 35, aggro: 26, special: 12, antiAir: 20 },
  normal: { react:  9, block: 62, aggro: 44, special: 30, antiAir: 45 },
  hard:   { react:  4, block: 84, aggro: 62, special: 52, antiAir: 74 }
};

class AI {
  constructor(level, seed){
    this.cfg = AI_LEVELS[level] || AI_LEVELS.normal;
    this.rng = makeRNG(seed || 12345);
    this.queue = [];
    this.cool = 0;
  }
  roll(n){ return this.rng() % n; }
  /* Queue a motion, holding each step for a couple of frames so the game's
     own leniency window sees it. */
  push(masks, hold){
    hold = hold || 2;
    for (const m of masks) for (let i = 0; i < hold; i++) this.queue.push(m);
    this.queue.push(0);
  }
  qcf(btn, fwd){ this.push([IN_DOWN, IN_DOWN|fwd, fwd, fwd|btn]); }
  qcb(btn, back){ this.push([IN_DOWN, IN_DOWN|back, back, back|btn]); }
  dp(btn, fwd){ this.push([fwd, IN_DOWN, IN_DOWN|fwd, IN_DOWN|fwd|btn]); }
  press(btn, hold){ this.push([btn], hold || 3); }

  think(me, opp, g){
    if (this.queue.length) return this.queue.shift();
    if (g.phase !== PH.FIGHT) return 0;
    if (me.state === S.HITSTUN || me.state === S.KNOCKDOWN || me.state === S.THROWN) return 0;
    if (this.cool > 0){ this.cool--; return this.holdMask || 0; }

    const c = this.cfg;
    const dist = Math.abs(me.px - opp.px);
    const fwd  = me.facing > 0 ? IN_RIGHT : IN_LEFT;
    const back = me.facing > 0 ? IN_LEFT  : IN_RIGHT;
    this.holdMask = 0;

    /* incoming projectile */
    for (const pr of g.projectiles){
      if (pr.owner === me.id) continue;
      const toward = (pr.x - me.x) * pr.vx < 0;
      const d = Math.abs(pr.x - me.x) / FP;
      if (toward && d < 110){
        if (this.roll(100) < c.block){ this.cool = 14; this.holdMask = back|IN_DOWN; return back|IN_DOWN; }
        this.push([IN_UP|fwd], 3); this.cool = 4; return IN_UP|fwd;
      }
    }
    /* anti-air: they are above and coming down at us */
    if (opp.airborne && dist < 70 && opp.py > 20 && this.roll(100) < c.antiAir){
      if (me.ch.specials.some(s => s.key === "rise")) this.dp(IN_HP, fwd);
      else if (me.ch.specials.some(s => s.key === "fang")) this.push([IN_DOWN,IN_DOWN,IN_DOWN,IN_UP|IN_HK], 6);
      else this.push([IN_DOWN|IN_HP], 4);
      this.cool = 8; return this.queue.shift();
    }
    /* respect an attack in progress */
    if (opp.state === S.ATTACK && dist < 78 && this.roll(100) < c.block){
      this.cool = c.react + 6;
      this.holdMask = back | (this.roll(2) ? IN_DOWN : 0);
      return this.holdMask;
    }
    /* super when it is available and they are close */
    if (me.meter >= METER_MAX && dist < 90 && this.roll(100) < c.special + 20){
      const btn = me.ch.super.key === "circuit" ? IN_MK : IN_MP;
      this.push([IN_DOWN, IN_DOWN|fwd, fwd, IN_DOWN, IN_DOWN|fwd, fwd, fwd|btn], 2);
      this.cool = 10; return this.queue.shift();
    }

    if (dist < 44){
      const r = this.roll(100);
      if (r < 14){ this.push([IN_LP|IN_LK], 3); }                        /* throw */
      else if (r < 30) this.press(IN_DOWN|IN_LK, 3);
      else if (r < 50) this.press(IN_MP, 3);
      else if (r < 66) this.press(IN_DOWN|IN_HK, 4);
      else if (r < 66 + c.special){
        const s = me.ch.specials[this.roll(me.ch.specials.length)];
        if (s.key === "rise") this.dp(IN_MP, fwd);
        else if (s.key === "clasp") this.push([back, IN_DOWN|back, IN_DOWN, IN_DOWN|fwd, fwd, fwd|IN_HP], 2);
        else if (s.charge === "back"){ this.push([back,back,back,back,back,back,back,back], 8); this.push([fwd|IN_MP], 3); }
        else if (s.charge === "down"){ this.push([IN_DOWN], 44); this.push([IN_UP|IN_MK], 3); }
        else if (s.key === "heel" || s.key === "anvil") this.qcb(IN_MK, back);
        else this.qcf(s.key === "razor" ? IN_MK : IN_MP, fwd);
      }
      else { this.cool = c.react; this.holdMask = back; return back; }
      this.cool = 6;
      return this.queue.length ? this.queue.shift() : 0;
    }
    if (dist < 96){
      const r = this.roll(100);
      if (r < c.aggro){ this.cool = 10; this.holdMask = fwd; return fwd; }
      if (r < c.aggro + 18){ this.press(IN_DOWN|IN_MK, 4); this.cool = 6; return this.queue.shift(); }
      if (r < c.aggro + 30){ this.push([IN_UP|fwd], 3); this.cool = 6; return IN_UP|fwd; }
      this.cool = 12; this.holdMask = back; return back;
    }
    /* long range */
    const r = this.roll(100);
    if (r < c.special){
      const s = me.ch.specials[0];
      if (s.charge === "back"){ this.push([back,back,back,back,back,back,back,back], 8); this.push([fwd|IN_HP], 3); }
      else this.qcf(IN_HP, fwd);
      this.cool = 8;
      return this.queue.length ? this.queue.shift() : 0;
    }
    this.cool = 12; this.holdMask = fwd;
    return fwd;
  }
}

/* ============================================================================
   NETPLAY — deterministic lockstep over a WebRTC data channel
   ----------------------------------------------------------------------------
   Neither peer sends game state. Each sends only its own input for a frame a
   few ticks in the future; a frame is simulated once both inputs for it are
   in hand. That keeps bandwidth at a few bytes per frame and guarantees both
   machines see exactly the same match — provided the simulation is
   deterministic, which is why it is integer-only. A rolling checksum catches
   it immediately if that ever stops being true.

   The tradeoff versus rollback netcode: your own inputs take NET_DELAY frames
   to appear. At 3 frames that is 50ms, which is unnoticeable at close range
   and honest at long range.
   ========================================================================== */

const Net = {
  peer:null, conn:null, isHost:false, code:"", state:"idle",
  localInputs:new Map(), remoteInputs:new Map(),
  simFrame:0, sendFrame:0, mySide:0,
  remoteChar:null, myChar:null, seed:0,
  stallFrames:0, desync:false, lastPing:0, ping:0,
  onStatus:null, onStart:null, onEnd:null, onRematch:null,

  makeCode(){
    const abc = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let s = "";
    const buf = new Uint8Array(5);
    (window.crypto || {}).getRandomValues
      ? crypto.getRandomValues(buf)
      : buf.forEach((_, i) => buf[i] = Math.floor(Math.random()*256));
    for (let i = 0; i < 5; i++) s += abc[buf[i] % abc.length];
    return s;
  },
  status(msg, kind){ if (this.onStatus) this.onStatus(msg, kind); },

  newPeer(id){
    if (typeof Peer === "undefined"){
      this.status("Could not load the peer-to-peer library. Check your connection, or play offline.", "err");
      return null;
    }
    const opts = { debug:0, config:{ iceServers: ICE_SERVERS } };
    if (PEER_SERVER_CONFIG) Object.assign(opts, PEER_SERVER_CONFIG);
    return id ? new Peer(id, opts) : new Peer(opts);
  },

  host(charKey){
    this.reset();
    this.isHost = true; this.myChar = charKey;
    this.code = this.makeCode();
    this.seed = (Date.now() ^ (Math.random()*0xffffffff)) >>> 0;
    this.state = "hosting";
    this.status("Opening room…");
    const p = this.newPeer(ROOM_PREFIX + this.code);
    if (!p){ this.code = ""; return; }
    this.peer = p;
    p.on("open", () => this.status("Room open. Give your friend the code."));
    p.on("error", e => this.handlePeerError(e));
    p.on("connection", c => {
      if (this.conn){ c.close(); return; }
      this.conn = c;
      this.wire(c);
    });
  },
  join(code, charKey){
    this.reset();
    this.isHost = false; this.myChar = charKey;
    this.code = String(code || "").toUpperCase().trim();
    this.state = "joining";
    this.status("Connecting to " + this.code + "…");
    const p = this.newPeer(null);
    if (!p) return;
    this.peer = p;
    p.on("error", e => this.handlePeerError(e));
    p.on("open", () => {
      const c = p.connect(ROOM_PREFIX + this.code, { reliable:true, serialization:"json" });
      this.conn = c;
      this.wire(c);
      setTimeout(() => {
        if (this.state === "joining") this.status("No answer. Check the code, or ask them to re-open the room.", "err");
      }, 12000);
    });
  },
  handlePeerError(e){
    const t = (e && e.type) || "";
    if (t === "peer-unavailable") this.status("No room with that code. Check the letters and try again.", "err");
    else if (t === "unavailable-id") this.status("That room code is taken. Go back and host again.", "err");
    else if (t === "network" || t === "server-error") this.status("Cannot reach the matchmaking server. Try again in a moment.", "err");
    else if (t === "browser-incompatible") this.status("This browser does not support peer-to-peer play.", "err");
    else this.status("Connection problem" + (t ? " (" + t + ")" : "") + ".", "err");
  },
  wire(c){
    c.on("open", () => {
      this.state = "handshake";
      this.status("Connected. Syncing…", "ok");
      this.send({ t:"hello", char:this.myChar, ver:GAME_VERSION });
      this.pingTimer = setInterval(() => {
        this.lastPing = performance.now();
        this.send({ t:"ping" });
      }, 2000);
    });
    c.on("data", d => this.onData(d));
    c.on("close", () => this.dropped("Opponent disconnected."));
    c.on("error", () => this.dropped("Connection lost."));
  },
  onData(d){
    if (!d || typeof d !== "object") return;
    switch (d.t){
      case "hello":
        if (this.versionClash(d.ver)) break;
        this.remoteChar = d.char;
        if (this.isHost) this.tryStart();
        break;
      case "badver":
        this.reportVersionClash(d.ver);
        break;
      case "start":
        if (this.versionClash(d.ver)) break;
        this.seed = d.seed >>> 0;
        this.remoteChar = d.hostChar;
        this.mySide = 1;
        this.beginMatch([d.hostChar, this.myChar]);
        break;
      case "i":
        if ((d.s >>> 0) !== this.seed) break;   /* stale packet from a previous match */
        this.remoteInputs.set(d.f, d.m|0);
        break;
      case "c":
        if ((d.s >>> 0) !== this.seed) break;
        this.checkSum(d.f, d.h >>> 0);
        break;
      case "ping": this.send({ t:"pong" }); break;
      case "pong": this.ping = Math.round(performance.now() - this.lastPing); break;
      case "rematch": if (this.onRematch) this.onRematch(d); break;
      case "bye": this.dropped("Opponent left."); break;
    }
  },
  tryStart(){
    if (!this.isHost || !this.remoteChar || this.state === "playing") return;
    this.mySide = 0;
    this.send({ t:"start", seed:this.seed, hostChar:this.myChar, ver:GAME_VERSION });
    this.beginMatch([this.myChar, this.remoteChar]);
  },
  /* Host only: roll a fresh seed and start another set. */
  restart(myChar){
    if (!this.isHost || !this.conn || !this.conn.open) return;
    this.myChar = myChar || this.myChar;
    this.seed = (Date.now() ^ (Math.random()*0xffffffff)) >>> 0;
    this.mySide = 0;
    this.send({ t:"start", seed:this.seed, hostChar:this.myChar, ver:GAME_VERSION });
    this.beginMatch([this.myChar, this.remoteChar]);
  },
  /* Refuse the match rather than let two different builds drift apart. */
  versionClash(theirs){
    if (theirs === GAME_VERSION) return false;
    this.send({ t:"badver", ver:GAME_VERSION });
    this.reportVersionClash(theirs);
    return true;
  },
  reportVersionClash(theirs){
    this.status("Different game versions — you are on " + GAME_VERSION +
                ", they are on " + (theirs || "an older build") +
                ". Both of you refresh the page, then try again.", "err");
    this.state = "dead";
    clearInterval(this.pingTimer);
    try { if (this.conn) this.conn.close(); } catch(e){}
  },
  beginMatch(charKeys){
    this.localInputs.clear(); this.remoteInputs.clear();
    for (let i = 0; i < NET_DELAY; i++){ this.localInputs.set(i, 0); this.remoteInputs.set(i, 0); }
    this.simFrame = 0; this.sendFrame = NET_DELAY;
    this.stallFrames = 0; this.desync = false;
    this.state = "playing";
    this.pendingChecks = new Map();
    if (this.onStart) this.onStart(charKeys, this.seed, this.mySide);
  },
  send(o){ try { if (this.conn && this.conn.open) this.conn.send(o); } catch(e){ /* channel closing */ } },

  /* Called once per simulated frame with our own input; returns the pair of
     inputs to step with, or null if we are still waiting on the opponent. */
  exchange(localMask, game){
    if (this.state !== "playing") return null;
    if (!this.localInputs.has(this.sendFrame)){
      this.localInputs.set(this.sendFrame, localMask);
      this.send({ t:"i", f:this.sendFrame, m:localMask, s:this.seed });
      this.sendFrame++;
    }
    const f = this.simFrame;
    if (!this.remoteInputs.has(f)){ this.stallFrames++; return null; }
    this.stallFrames = 0;
    const mine = this.localInputs.get(f) | 0, theirs = this.remoteInputs.get(f) | 0;
    this.simFrame++;
    /* prune */
    if (f > 240){ this.localInputs.delete(f - 240); this.remoteInputs.delete(f - 240); }
    /* periodic desync check */
    if (game && f % 60 === 0){
      const h = hashState(game);
      this.pendingChecks.set(f, h);
      this.send({ t:"c", f, h, s:this.seed });
      if (this.pendingChecks.size > 20) this.pendingChecks.delete(this.pendingChecks.keys().next().value);
    }
    return this.mySide === 0 ? [mine, theirs] : [theirs, mine];
  },
  checkSum(f, h){
    if (!this.pendingChecks) return;
    if (!this.pendingChecks.has(f)) { this.pendingLate = this.pendingLate || new Map(); this.pendingLate.set(f, h); return; }
    if (this.pendingChecks.get(f) !== h && !this.desync){
      this.desync = true;
      this.status("Desync detected — the match is no longer in sync.", "err");
    }
  },
  dropped(msg){
    if (this.state === "dead") return;
    this.state = "dead";
    clearInterval(this.pingTimer);
    if (this.onEnd) this.onEnd(msg);
  },
  reset(){
    clearInterval(this.pingTimer);
    try { if (this.conn) this.conn.close(); } catch(e){}
    try { if (this.peer) this.peer.destroy(); } catch(e){}
    this.peer = null; this.conn = null; this.state = "idle";
    this.localInputs.clear(); this.remoteInputs.clear();
    this.remoteChar = null; this.desync = false; this.ping = 0;
  },
  leave(){ this.send({ t:"bye" }); this.reset(); }
};

function charInfoHTML(key){
  const c = CHAR_BY_KEY[key];

  for (const s of c.specials) h += '<div><b>' + s.make(IN_MP).name + '</b> — ' + (NOTATION[s.key] || "") + "</div>";
  h += '<div><b>' + c.super.name + '</b> — ' + (NOTATION[c.super.key] || "") + "</div></div>";
  return h;
}

    'to introduce the two of you; no game data passes through it.<br><br>' +
    'Online play needs this page served over <b>https</b> from a site that allows outbound ' +
    'connections. Opening the file from disk, or from a sandboxed preview, gives you the ' +
    'offline modes only.</div>'
  );
  bind("#host", sceneHost);
  bind("#join", sceneJoin);
  bind("#back", () => sceneCharSelect("net"));
}

function netStatusHook(){
  Net.onStatus = (msg, kind) => {
    const el = $(".status");
    if (el){ el.textContent = msg; el.className = "status" + (kind ? " " + kind : ""); }
  };
  Net.onStart = (charKeys, seed, mySide) => startNetMatch(charKeys, seed, mySide);
  Net.onEnd = msg => {
    if (scene === "match" || scene === "results") sceneDisconnected(msg);
    else { const el = $(".status"); if (el){ el.textContent = msg; el.className = "status err"; } }
  };
}

function sceneHost(){
  scene = "lobby";
  panel(
    '<h1>Your room</h1><h2>Send this code to your opponent</h2>' +
    '<div class="bigcode" id="code">·····</div>' +
    '<div class="row"><button class="mi ghost" id="copy" style="text-align:center">Copy code</button>' +
    '<button class="mi ghost" id="cancel" style="text-align:center">Cancel</button></div>' +
    '<div class="status">Opening room…</div>'
  );
  netStatusHook();
  Net.host(sel.p1);
  $("#code").textContent = Net.code || "—";
  bind("#copy", () => {
    const t = Net.code;
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(
      () => Net.status("Code copied.", "ok"), () => Net.status("Copy failed — read it out instead."));
    else Net.status("Copy is unavailable here — read it out instead.");
  });
  bind("#cancel", () => { Net.leave(); sceneOnline(); });
}

function sceneJoin(){
  scene = "lobby";
  panel(
    '<h1>Join</h1><h2>Enter the five-letter code</h2>' +
    '<input class="code" id="codein" maxlength="5" autocomplete="off" spellcheck="false" placeholder="-----">' +
    '<div class="row" style="margin-top:10px"><button class="mi ghost" id="cancel" style="text-align:center">Back</button>' +
    '<button class="mi" id="go" style="text-align:center">Connect</button></div>' +
    '<div class="status"></div>'
  );
  netStatusHook();
  const inp = $("#codein");
  inp.focus();
  inp.addEventListener("keydown", e => {
    e.stopPropagation();
    if (e.key === "Enter") $("#go").click();
  });
  bind("#go", () => {
    const code = inp.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (code.length < 5){ Net.status("That code is five characters long.", "err"); return; }
    Net.join(code, sel.p1);
  });
  bind("#cancel", () => { Net.leave(); sceneOnline(); });
}

function sceneDisconnected(msg){
  scene = "results";
  Net.reset();
  panel('<h1>Disconnected</h1><h2>' + msg + "</h2>" +
    '<button class="mi" id="back">Back to menu</button>');
  bind("#back", sceneTitle);
}

/* ---- starting and ending matches ------------------------------------------ */

let netSide = 0, rematchMe = false, rematchThem = false;

function startOfflineMatch(){
  const seed = (Date.now() & 0x7fffffff) >>> 0;
  game = new Game([sel.p1, sel.p2], seed);
  ai = mode === "cpu" ? new AI(sel.diff, seed ^ 0x5bf03635) : null;
  aiSide = 1;
  hud[0].trail = hud[1].trail = 1;
  paused = false; scene = "match";
  closePanel();
  Sfx.unlock(); Sfx.play("round");
}
function startNetMatch(charKeys, seed, mySide){
  netSide = mySide;
  mode = "net";
  game = new Game(charKeys, seed);
  hud[0].trail = hud[1].trail = 1;
  rematchMe = rematchThem = false;
  netStalled = 0; paused = false; scene = "match";
  closePanel();
  Sfx.unlock(); Sfx.play("round");
}

function showResults(){
  scene = "results";
  const w = game.matchWinner;
  const title = w < 0 ? "Draw game" : game.fighters[w].ch.name + " wins";
  let sub;
  if (mode === "net") sub = w === netSide ? "You win the set." : w < 0 ? "Even on rounds." : "You lost the set.";
  else if (mode === "cpu") sub = w === 0 ? "You win." : "The CPU takes it.";
  else sub = "Player " + (w + 1) + " takes the set.";

  let html = "<h1>" + title + "</h1><h2>" + sub + "</h2>" +
    "<p>" + game.fighters[0].ch.name + " " + game.fighters[0].wins + " — " +
    game.fighters[1].wins + " " + game.fighters[1].ch.name + "</p>";
  if (mode === "net") html += '<div class="status" id="rmStatus">' +
    (Net.ping ? "Ping " + Net.ping + "ms" : "") + "</div>";
  html += '<button class="mi" id="again">Rematch</button>' +
          '<button class="mi ghost" id="chars">Change fighter</button>' +
          '<button class="mi ghost" id="menu">Main menu</button>';
  panel(html);

  bind("#again", () => {
    if (mode === "net"){
      rematchMe = true;
      Net.send({ t:"rematch" });
      const el = $("#rmStatus");
      if (el){ el.textContent = "Rematch requested — waiting for your opponent…"; el.className = "status"; }
      tryRematch();
    } else startOfflineMatch();
  });
  bind("#chars", () => {
    if (mode === "net"){ Net.leave(); sceneCharSelect("net"); }
    else sceneCharSelect(mode, 1);
  });
  bind("#menu", () => { if (mode === "net") Net.leave(); sceneTitle(); });
}
function tryRematch(){
  if (!(rematchMe && rematchThem)) return;
  rematchMe = rematchThem = false;
  if (Net.isHost) Net.restart(sel.p1);
  /* the guest simply waits for the host's "start" */
}

/* ---- pause ---------------------------------------------------------------- */
function togglePause(){
  if (scene !== "match" || mode === "net") return;
  paused = !paused;
  if (paused){
    panel('<h1>Paused</h1><h2>' + game.fighters[0].ch.name + " vs " + game.fighters[1].ch.name + "</h2>" +
      '<button class="mi" id="resume">Resume</button>' +
      '<button class="mi ghost" id="restart">Restart match</button>' +
      '<button class="mi ghost" id="quit">Quit to menu</button>');
    bind("#resume", togglePause);
    bind("#restart", startOfflineMatch);
    bind("#quit", sceneTitle);
  } else closePanel();
}

/* ---- attract screen ------------------------------------------------------- */
function renderTitle(){
  const st = stageFor("neon");
  const camX = (titleFrame * 0.22) % (STAGE_W - W);
  sctx.fillStyle = "#05060f"; sctx.fillRect(0, 0, W, H);
  sctx.drawImage(st.far,  Math.round(-camX * 0.25), 0);
  sctx.drawImage(st.near, Math.round(-camX * 0.55), 0);
  sctx.drawImage(st.floor, Math.round(-camX), GROUND_Y - 2);
  const spots = [[58, 1], [W - 58, -1]];
  for (let i = 0; i < 2; i++){
    const ch = CHARACTERS[i === 0 ? 0 : 1];
    const pose = animPose(ANIM.idle, titleFrame + i * 13);
    const spr = getSprite(ch, pose, spots[i][1], null);
    sctx.fillStyle = "rgba(0,0,0,.34)";
    sctx.fillRect(spots[i][0] - 15, GROUND_Y - 2, 30, 4);
    sctx.drawImage(spr, spots[i][0] - SPRITE_OX, GROUND_Y - SPRITE_OY);
  }
  sctx.fillStyle = "rgba(5,6,15,.55)"; sctx.fillRect(0, 0, W, H);
  drawTextC(sctx, "IRON CIRCUIT", W/2 + 2, 26, "#3a1020", 3, 3);
  drawTextC(sctx, "IRON CIRCUIT", W/2, 24, "#ffcc33", 3, 3);
  if (((titleFrame >> 5) & 1) === 0)
    drawTextC(sctx, "INSERT NOTHING - PLAY FREE", W/2, H - 22, "#8b88a3", 1, 1);
}

/* ---- main loop ------------------------------------------------------------ */
let acc = 0, last = performance.now();

function tick(){
  titleFrame++;
  if (scene !== "match" || !game || paused) return;

  if (mode === "net"){
    if (Net.state !== "playing") return;
    const local = cleanMask(Input.read(KEYMAP_SOLO) | Pad.readAny() | Touch.read());
    const pair = Net.exchange(local, game);
    if (!pair){ netStalled++; return; }
    netStalled = 0;
    game.step(pair);
  } else if (mode === "local"){
    /* Two players share the keyboard; a pad each takes precedence if present. */
    const i0 = cleanMask(Input.read(KEYMAP_P1) | Pad.read(0) | Touch.read());
    const i1 = cleanMask(Input.read(KEYMAP_P2) | Pad.read(1));
    game.step([i0, i1]);
  } else {
    const i0 = cleanMask(Input.read(KEYMAP_SOLO) | Pad.readAny() | Touch.read());
    const i1 = ai.think(game.fighters[1], game.fighters[0], game);
    game.step([i0, i1]);
  }
  if (game.phase === PH.MATCHEND && game.phaseTimer > 140) showResults();
}

let touchShown = null;
function draw(){
  /* The on-screen pad covers the whole frame, so it may only be up while a
     match is actually running — otherwise it would swallow menu taps. */
  const playing = scene === "match" && !paused;
  if (playing !== touchShown){
    touchShown = playing;
    document.body.classList.toggle("playing", playing);
    if (!playing){ Touch.pointers.clear(); Touch.recompute(); }
  }
  if ((scene === "match" || scene === "results") && game){
    render(game);
    if (mode === "net" && netStalled > 30){
      const msg = netStalled > 600 ? "OPPONENT NOT RESPONDING" : "WAITING FOR OPPONENT";
      sctx.fillStyle = "rgba(5,6,15,.72)"; sctx.fillRect(0, H/2 - 16, W, 32);
      drawTextC(sctx, msg, W/2, H/2 - 4, "#ffcc33", 1, 1);
    }
    if (mode === "net" && Net.desync){
      sctx.fillStyle = "rgba(120,10,20,.8)"; sctx.fillRect(0, 4, W, 12);
      drawTextC(sctx, "DESYNC - RESULT UNRELIABLE", W/2, 6, "#fff", 1, 1);
    }
  } else {
    renderTitle();
  }
}

function frame(now){
  requestAnimationFrame(frame);
  let dt = now - last; last = now;
  if (dt > 250) dt = 250;
  acc += dt;
  let steps = 0;
  while (acc >= TICK_MS && steps < 6){ acc -= TICK_MS; steps++; tick(); }
  draw();
}

/* ---- fit the canvas to the window ---------------------------------------- */
function fit(){
  const wrap = document.getElementById("wrap");
  const aw = wrap.clientWidth - 12;
  /* In portrait the on-screen controls sit below the screen rather than over
     it, so the canvas only gets the top half. */
  const portrait = wrap.clientHeight > wrap.clientWidth;
  const ah = (Touch.active && portrait ? wrap.clientHeight * 0.52 : wrap.clientHeight) - 12;
  let s = Math.min(aw / W, ah / H);
  s = Touch.active
    ? Math.max(0.4, Math.round(s * 20) / 20)                    /* fill a small screen */
    : (s >= 1 ? Math.floor(s) : Math.max(0.4, Math.floor(s * 20) / 20));  /* stay crisp */
  screen.style.width  = Math.round(W * s) + "px";
  screen.style.height = Math.round(H * s) + "px";
}

/* ---- boot ----------------------------------------------------------------- */
Settings.load();
rebuildMaps();
sel.p1 = Settings.p1; sel.p2 = Settings.p2; sel.diff = Settings.diff;
Input.init();
Touch.init();
Touch.apply();
Sfx.muted = Settings.muted;
addEventListener("resize", () => { Touch.apply(); fit(); });
addEventListener("orientationchange", () => setTimeout(() => { Touch.apply(); fit(); }, 120));
addEventListener("gamepadconnected", () => { if (scene === "settings") sceneSettings(); });
addEventListener("keydown", e => {
  if (e.target && (e.target.tagName === "INPUT")) return;
  if (Input.capturing) return;
  if (e.code === "Escape") togglePause();
  if (e.code === "KeyM"){
    const m = Sfx.toggleMute();
    Settings.muted = m; Settings.save();
    const l = document.getElementById("muteLbl");
    if (l) l.textContent = m ? "Sound off" : "Sound on";
  }
});
Net.onRematch = () => { rematchThem = true; tryRematch(); };
fit();
sceneTitle();
requestAnimationFrame(frame);
</script>
</body>
</html>
