<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Iron Circuit</title>
<style>
  :root{
    --bg:#07070c; --ink:#e8e6f0; --dim:#8b88a3;
    --accent:#ffcc33; --accent2:#ff5566; --good:#5ce08a;
    --panel:rgba(12,12,22,.92); --line:rgba(255,255,255,.14);
    --mono:"Courier New",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--mono); overflow:hidden;
    -webkit-font-smoothing:none;
    display:flex; align-items:center; justify-content:center;
  }
  #wrap{
    position:relative; width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(120% 90% at 50% 0%, #14142a 0%, #07070c 70%);
  }
  #screen{
    position:relative;
    image-rendering:pixelated; image-rendering:crisp-edges;
    display:block;
    box-shadow:0 0 0 2px #000, 0 0 0 4px #24243a, 0 30px 80px rgba(0,0,0,.8);
    background:#000; touch-action:none;
  }
  /* ---------- DOM overlay menus ---------- */
  #ui{
    position:absolute; inset:0; display:flex;
    align-items:center; justify-content:center;
    pointer-events:none;
  }
  .panel{
    pointer-events:auto;
    background:var(--panel); border:2px solid var(--line);
    padding:22px 26px; min-width:330px; max-width:min(560px,92vw);
    max-height:86vh; overflow:auto;
    box-shadow:0 20px 60px rgba(0,0,0,.7);
    backdrop-filter:blur(3px);
  }
  .panel h1{
    margin:0 0 2px; font-size:26px; letter-spacing:5px;
    color:var(--accent); text-transform:uppercase;
    text-shadow:2px 2px 0 #a33, 4px 4px 0 rgba(0,0,0,.5);
  }
  .panel h2{margin:0 0 14px;font-size:11px;letter-spacing:3px;color:var(--dim);font-weight:400;text-transform:uppercase}
  .panel h3{margin:16px 0 8px;font-size:11px;letter-spacing:2px;color:var(--accent);text-transform:uppercase}
  .panel p{margin:0 0 12px;font-size:12px;line-height:1.65;color:var(--dim)}
  .panel p b{color:var(--ink);font-weight:700}
  button.mi{
    display:block; width:100%; text-align:left; margin:0 0 7px;
    background:#15152a; color:var(--ink); border:2px solid var(--line);
    padding:11px 13px; font-family:var(--mono); font-size:13px;
    letter-spacing:1.5px; cursor:pointer; text-transform:uppercase;
    transition:background .08s,border-color .08s,transform .08s;
  }
  button.mi:hover,button.mi:focus{background:#22224a;border-color:var(--accent);outline:none;transform:translateX(3px)}
  button.mi:disabled{opacity:.35;cursor:not-allowed;transform:none}
  button.mi .sub{display:block;font-size:10px;color:var(--dim);letter-spacing:.5px;margin-top:3px;text-transform:none}
  button.ghost{background:transparent;border-color:rgba(255,255,255,.1)}
  .row{display:flex;gap:8px;align-items:center}
  .row>*{flex:1}
  input.code{
    width:100%; background:#0a0a16; border:2px solid var(--line); color:var(--accent);
    font-family:var(--mono); font-size:26px; letter-spacing:10px; text-align:center;
    padding:12px 8px; text-transform:uppercase;
  }
  input.code:focus{outline:none;border-color:var(--accent)}
  .bigcode{
    font-size:38px; letter-spacing:14px; color:var(--accent); text-align:center;
    padding:14px 0 10px; text-shadow:0 0 24px rgba(255,204,51,.35);
  }
  .status{font-size:11px;color:var(--dim);min-height:17px;letter-spacing:1px;margin-top:10px}
  .status.err{color:var(--accent2)}
  .status.ok{color:var(--good)}
  table.keys{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:10px}
  table.keys td{padding:4px 6px;border-bottom:1px solid rgba(255,255,255,.07);color:var(--dim)}
  table.keys td:first-child{color:var(--ink);white-space:nowrap;width:44%}
  kbd{
    background:#22223e;border:1px solid rgba(255,255,255,.2);border-bottom-width:2px;
    border-radius:3px;padding:1px 5px;font-family:var(--mono);font-size:10px;color:var(--ink)
  }
  .hide{display:none!important}
  /* character select grid */
  .csgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:9px;margin:6px 0 4px}
  .cscard{
    background:#15152a;border:2px solid var(--line);padding:9px 8px;cursor:pointer;
    text-align:center;transition:border-color .08s,background .08s;
  }
  .cscard:hover{background:#22224a}
  .cscard.sel{border-color:var(--accent);background:#2a2a12}
  .cscard.p2sel{border-color:#55aaff}
  .cscard .nm{font-size:12px;letter-spacing:2px;text-transform:uppercase;margin-top:5px}
  .cscard .rl{font-size:9px;color:var(--dim);letter-spacing:.5px;margin-top:2px}
  .cscard canvas{image-rendering:pixelated;display:block;margin:0 auto}
  .movelist{font-size:11px;line-height:1.7;color:var(--dim)}
  .movelist b{color:var(--accent);font-weight:400}
  .foot{margin-top:14px;font-size:10px;color:#55536b;letter-spacing:1px;line-height:1.6}
  /* ---------- on-screen controls ---------- */
  #touch{position:absolute;inset:0;z-index:40;touch-action:none;-webkit-user-select:none;user-select:none;display:none}
  body.touch.playing #touch{display:block}
  body.touch #wrap{align-items:flex-start;padding-top:5vh}
  @media (orientation:landscape){ body.touch #wrap{align-items:center;padding-top:0} }
  #tpad{
    position:absolute;left:3.5vw;bottom:7vh;width:min(30vw,148px);aspect-ratio:1;border-radius:50%;
    background:rgba(12,12,22,.34);border:2px solid rgba(255,255,255,.13);
    box-shadow:inset 0 0 0 8px rgba(255,255,255,.03);
  }
  #tnub{
    position:absolute;width:38%;height:38%;left:31%;top:31%;border-radius:50%;
    background:rgba(255,204,51,.62);border:2px solid rgba(0,0,0,.35);
    transition:transform .04s linear;pointer-events:none;
  }
  #tbtns{
    position:absolute;right:3.5vw;bottom:7vh;
    display:grid;grid-template-columns:repeat(3,1fr);gap:min(2.2vw,12px);
  }
  .tbtn{
    width:min(13.5vw,62px);aspect-ratio:1;border-radius:50%;
    background:rgba(12,12,22,.34);border:2px solid rgba(255,255,255,.13);
    color:var(--ink);font-family:var(--mono);font-size:min(3.4vw,15px);letter-spacing:1px;
    display:flex;align-items:center;justify-content:center;
  }
  .tbtn.p{border-color:rgba(255,204,51,.42);color:rgba(255,204,51,.85)}
  .tbtn.k{border-color:rgba(90,168,224,.42);color:rgba(143,201,240,.85)}
  .tbtn.on{background:rgba(255,204,51,.42);color:#fff;border-color:rgba(255,204,51,.9);transform:scale(.92)}
  #thint{
    position:absolute;left:0;right:0;top:32%;text-align:center;pointer-events:none;
    color:var(--dim);font-size:12px;letter-spacing:2px;text-transform:uppercase;
  }
  @media (orientation:landscape){ #thint{display:none} }
  #tpause{
    position:absolute;right:3.5vw;top:2.5vh;width:38px;height:30px;border-radius:6px;
    background:rgba(12,12,22,.4);border:2px solid rgba(255,255,255,.13);color:rgba(232,230,240,.8);
    font-family:var(--mono);font-size:13px;display:flex;align-items:center;justify-content:center;
  }
  /* ---------- key binding table ---------- */
  table.binds{width:100%;border-collapse:collapse;font-size:11px}
  table.binds th{
    text-align:left;color:var(--accent);font-weight:400;letter-spacing:2px;
    font-size:10px;text-transform:uppercase;padding:0 6px 6px;
  }
  table.binds td{padding:3px 6px;border-bottom:1px solid rgba(255,255,255,.07);color:var(--dim)}
  table.binds td:first-child{color:var(--ink);width:42%}
  button.keycap{
    width:100%;background:#15152a;border:2px solid var(--line);color:var(--ink);
    font-family:var(--mono);font-size:10px;padding:5px 4px;cursor:pointer;letter-spacing:1px;
  }
  button.keycap:hover{border-color:var(--accent)}
  button.keycap.listening{border-color:var(--accent);color:var(--accent);background:#2a2a12}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="screen" width="384" height="216"></canvas>
  <div id="ui"></div>
  <div id="touch"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>
"use strict";
/* Generated by tools/build.mjs from src/ — do not edit this file directly. */
/* ============================================================================
   IRON CIRCUIT — a browser fighting game
   ----------------------------------------------------------------------------
   Original characters and art. Inspired by the arcade fighting genre; contains
   no third-party sprites, names, audio, or other assets.

   Architecture
     - Deterministic integer-only simulation at a fixed 60Hz tick.
     - Rendering is decoupled and may use floats freely.
     - Online play is lockstep: both peers run the identical simulation and
       exchange only input bitmasks, with a few frames of input delay.
   ========================================================================== */

/* ---- Configuration you may want to change -------------------------------- */

/* Signalling broker used only to introduce two browsers to each other. Once
   connected, match traffic is peer-to-peer and never touches this server.
   The default is PeerJS's free public broker: fine for play, best-effort
   uptime. To use your own PeerServer, replace this whole object, e.g.
     { host:"peer.example.com", port:443, secure:true, path:"/" }            */
const PEER_SERVER_CONFIG = null;  /* null = PeerJS public cloud broker */

/* STUN lets two browsers discover their public addresses, which is enough on
   most home networks. It is not enough on symmetric NATs — a lot of corporate
   and mobile networks — where the only way through is a TURN relay that both
   sides send their traffic to. TURN costs money to run or rent, so the slot is
   empty by default and the game tells the player plainly when a connection
   fails for that reason.

   To add one, drop in the credentials your provider gives you:

     const TURN_SERVERS = [{
       urls: ["turn:turn.example.com:3478", "turns:turn.example.com:5349"],
       username: "...", credential: "..."
     }];

   Long-lived credentials in a public page can be harvested and used to relay
   someone else's traffic at your expense, so prefer a provider that issues
   short-lived ones, and fetch them at runtime rather than pasting them here. */
const TURN_SERVERS = [];

const STUN_SERVERS = [
  { urls: "stun:stun.l.google.com:19302" },
  { urls: "stun:global.stun.twilio.com:3478" }
];
const ICE_SERVERS = STUN_SERVERS.concat(TURN_SERVERS);

/* How long to keep trying to re-establish a dropped match before giving up. */
const RECONNECT_WINDOW_MS = 20000;
const RECONNECT_RETRY_MS  = 2000;

const ROOM_PREFIX  = "ironcircuit-v1-";  /* namespaces room codes on the broker */

/* Two peers must be running identical code or their simulations will drift
   apart. Bump this on EVERY release: a mismatched pair is refused up front
   with a "refresh the page" message, which is a far cheaper failure than a
   match that silently desyncs halfway through. */
const GAME_VERSION = "1.7.0";
const NET_DELAY    = 3;                  /* frames of input delay in online play */

/* ---- Screen / world constants -------------------------------------------- */

const W = 384, H = 216;          /* internal resolution, scaled up on display */
const GROUND_Y   = 186;          /* y of the floor line, in screen pixels     */
const STAGE_W    = 880;          /* playfield width in world pixels           */
const FP         = 256;          /* fixed-point scale: 1px = 256 units        */
const GRAVITY    = 62;           /* fixed-point units per frame^2             */
const TICK_MS    = 1000 / 60;

/* Input bits. Directions are stored raw (screen-relative); the simulation
   converts them to facing-relative values so replays and netplay agree.      */
const IN_UP=1, IN_DOWN=2, IN_LEFT=4, IN_RIGHT=8,
      IN_LP=16, IN_MP=32, IN_HP=64, IN_LK=128, IN_MK=256, IN_HK=512;
const PUNCHES = IN_LP|IN_MP|IN_HP;
const KICKS   = IN_LK|IN_MK|IN_HK;
const BUTTONS = PUNCHES|KICKS;

/* ---- Small deterministic helpers ----------------------------------------- */

const clamp = (v,lo,hi) => v < lo ? lo : v > hi ? hi : v;
const sign  = v => v < 0 ? -1 : v > 0 ? 1 : 0;

/* Seeded LCG. The host picks the seed and sends it, so both peers roll the
   same numbers. Only ever used for cosmetic-but-synced things (hit sparks,
   AI jitter) — never for anything a desync check would miss. */
function makeRNG(seed){
  let s = (seed >>> 0) || 1;
  return function(){
    s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
    return s;
  };
}

/* FNV-1a over the parts of the game state that must match across peers. */
function hashState(g){
  let h = 0x811c9dc5;
  const mix = v => { h ^= (v|0); h = Math.imul(h, 0x01000193) >>> 0; };
  mix(g.frame); mix(g.timer); mix(g.phase);
  for (const f of g.fighters){
    mix(f.x); mix(f.y); mix(f.vx); mix(f.vy);
    mix(f.hp); mix(f.state); mix(f.stateFrame); mix(f.facing);
    mix(f.moveId); mix(f.hitstun); mix(f.blockstun); mix(f.meter); mix(f.comboHits);
    mix(f.wins); mix(f.airborne ? 1 : 0);
  }
  return h >>> 0;
}

/* ============================================================================
   COLOUR — a Mega Drive palette, and the shading that goes with it
   ----------------------------------------------------------------------------
   The console look is a set of constraints, not a filter. The VDP stored three
   bits per channel, so every colour on a Mega Drive is one of 512, and those
   eight levels per channel are not an even split of 0-255 — they are what the
   DAC actually put out. Snapping to them is most of the look.

   The other half is what the hardware could not do: there was no alpha
   blending, so anything see-through was a checkerboard of two solid colours,
   and there was no per-pixel lighting, so form came from hand-placed tone
   ramps. Both are reproduced here rather than approximated with transparency.
   ========================================================================== */

const MD_LEVELS = [0, 52, 87, 116, 144, 172, 206, 255];

function mdLevel(v){
  v = v < 0 ? 0 : v > 255 ? 255 : v;
  let best = 0, bestD = 1e9;
  for (const l of MD_LEVELS){ const d = Math.abs(l - v); if (d < bestD){ bestD = d; best = l; } }
  return best;
}
const hex2 = v => v.toString(16).padStart(2, "0");

/* Snapping each channel on its own is what the hardware does to a colour it is
   given, but it is not what an artist choosing a colour FOR the hardware does.
   The gap from 0 to 52 is the widest step in the ramp, so a near-neutral dark
   like (23,26,35) rounds to (0,0,52) — a twelve-point chroma becomes a
   fifty-two-point navy. Whole surfaces meant to read as dark grey came out as
   saturated blue bars. So the snap is constrained: quantise the value, then
   allow the channels to spread apart only as far as the colour was actually
   colourful to begin with. Saturated colours are unaffected, because their
   input chroma buys them the spread they need. */
const LEVEL_STEP = 36;                       /* mean gap between MD levels */
function levelIndex(v){
  let best = 0, bestD = 1e9;
  for (let i = 0; i < MD_LEVELS.length; i++){
    const d = Math.abs(MD_LEVELS[i] - v);
    if (d < bestD){ bestD = d; best = i; }
  }
  return best;
}
function mdRGB(r, g, b){
  r = r < 0 ? 0 : r > 255 ? 255 : r;
  g = g < 0 ? 0 : g > 255 ? 255 : g;
  b = b < 0 ? 0 : b > 255 ? 255 : b;
  const idx = [levelIndex(r), levelIndex(g), levelIndex(b)];
  const chroma = Math.max(r, g, b) - Math.min(r, g, b);
  const spread = Math.round(chroma / LEVEL_STEP);
  if (idx[0] - Math.min(...idx) > spread || Math.max(...idx) - idx[0] > spread ||
      Math.max(...idx) - Math.min(...idx) > spread){
    /* anchor on the channel nearest the colour's own mean, then clamp */
    const mean = (r + g + b) / 3, base = levelIndex(mean);
    for (let i = 0; i < 3; i++)
      idx[i] = idx[i] < base - spread ? base - spread
             : idx[i] > base + spread ? base + spread : idx[i];
  }
  return "#" + hex2(MD_LEVELS[idx[0]]) + hex2(MD_LEVELS[idx[1]]) + hex2(MD_LEVELS[idx[2]]);
}
function parseHex(h){
  if (h.length === 4) h = "#" + h[1] + h[1] + h[2] + h[2] + h[3] + h[3];
  return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
}
/* Snap any colour onto the console's palette. */
function md(h){ const [r,g,b] = parseHex(h); return mdRGB(r, g, b); }

/* Lighter and darker versions of a colour.

   Done in HSV, not by scaling RGB channels. Scaling channels independently
   pushes them into the same quantisation bucket at low values, and an eight
   level ramp is coarse enough that a "dark skin tone" comes out grey. Pixel
   artists never darken that way either: shadows keep their saturation and
   rotate towards blue, highlights lose saturation and rotate towards warm.
   Doing that keeps the hue alive after the colour is snapped to the console
   palette, which is the whole point. */
function rgb2hsv(r, g, b){
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b), d = mx - mn;
  let h = 0;
  if (d){
    if (mx === r) h = ((g - b) / d + (g < b ? 6 : 0)) * 60;
    else if (mx === g) h = ((b - r) / d + 2) * 60;
    else h = ((r - g) / d + 4) * 60;
  }
  return [h, mx ? d / mx : 0, mx];
}
function hsv2rgb(h, s, v){
  h = ((h % 360) + 360) % 360;
  const c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c;
  let r = 0, g = 0, b = 0;
  if (h < 60){ r = c; g = x; } else if (h < 120){ r = x; g = c; }
  else if (h < 180){ g = c; b = x; } else if (h < 240){ g = x; b = c; }
  else if (h < 300){ r = x; b = c; } else { r = c; b = x; }
  return [(r + m) * 255, (g + m) * 255, (b + m) * 255];
}
/* Rotate a hue the short way round towards a target. */
function towards(h, target, amt){
  let d = ((target - h + 540) % 360) - 180;
  return h + d * amt;
}
function tone(hex, amt){
  let [h, s, v] = rgb2hsv(...parseHex(hex));
  if (amt >= 0){
    v = v + (1 - v) * amt * 0.86;
    s = s * (1 - amt * 0.46);
    h = towards(h, 45, amt * 0.30);          /* highlights drift warm */
  } else {
    const a = -amt;
    v = v * (1 - a * 0.62);
    s = Math.min(1, s * (1 + a * 0.55) + a * 0.10);
    h = towards(h, 250, a * 0.26);           /* shadows drift cool */
  }
  return mdRGB(...hsv2rgb(h, s, v));
}

/* Five tones per material: the most a 16-colour palette can spend on one
   surface and still leave room for everything else.

   A base colour near white or near black has nowhere to go — pure white
   cannot be highlighted, and five shades of near-black all snap to the same
   value. So the base is first pulled into the middle of the range, exactly as
   an artist picks light grey rather than white for hair they intend to shade.
   The tones are then nudged apart until all five survive the quantiser as
   different colours, which the loop below guarantees rather than assumes. */
function ramp(hex){
  let [h, s0, v0] = rgb2hsv(...parseHex(hex));
  const v = clamp(v0, 0.32, 0.76);
  const lo = Math.max(0.08, v * 0.34);
  const hi = Math.min(1, v + (1 - v) * 0.66);
  const at = (val, warm) => {
    const t = (val - v) / (val >= v ? Math.max(0.001, hi - v) : Math.max(0.001, v - lo));
    /* Highlights lose only a little saturation. Draining it turns a saturated
       red into peach, which then collides with skin — an outfit that reads as
       bare arms. Bright and still coloured is what a lit surface looks like. */
    const sat = val >= v ? s0 * (1 - t * 0.28) : Math.min(1, s0 * (1 + (-t) * 0.50) + (-t) * 0.09);
    /* Highlights barely rotate. Sending a hue "towards warm" takes the short
       way round the wheel, and for anything blue that route runs through
       green — a blue tunic with a mint highlight. Desaturating and raising
       the value is what actually reads as lit; the hue can stay put. */
    const hue = val >= v ? towards(h, 45, t * 0.08) : towards(h, 250, (-t) * 0.28);
    return mdRGB(...hsv2rgb(hue, clamp(sat, 0, 1), clamp(val, 0, 1)));
  };
  const targets = [lo, lo + (v - lo) * 0.52, v, v + (hi - v) * 0.48, hi];
  const out = [];
  for (let i = 0; i < 5; i++){
    let val = targets[i], col = at(val, i > 2);
    /* Walk it away from its neighbour until the quantiser tells them apart. */
    for (let tries = 0; tries < 24 && i > 0 && col === out[i - 1]; tries++){
      val = clamp(val + 0.035, 0, 1);
      col = at(val, i > 2);
    }
    out.push(col);
  }
  /* A base that is already near white cannot be pushed up any further, so the
     collision has to be resolved by pulling the tone below it down instead.
     Running both directions is what makes white hair shadeable at all. */
  for (let i = 4; i > 0; i--){
    let val = targets[i - 1];
    for (let tries = 0; tries < 24 && out[i] === out[i - 1]; tries++){
      val = clamp(val - 0.035, 0, 1);
      out[i - 1] = at(val, i - 1 > 2);
    }
  }
  return {
    dk: out[0], sh: out[1], mid: out[2], lit: out[3], hi: out[4],
    /* A cool rim along the unlit edge: what separates a sprite from the
       background without an outline heavy enough to look like a sticker. */
    /* Dim on purpose. A rim is a hint that the figure has a far side, not a
       neon outline — at full brightness it reads as a glow effect and fights
       the silhouette it is supposed to support. */
    rim: mdRGB(...hsv2rgb(towards(h, 212, 0.60), Math.min(1, s0 * 0.42 + 0.10),
                          clamp(v * 0.42 + 0.16, 0, 0.62)))
  };
}
/* True when all five body tones snapped to different colours. */
function rampIsDistinct(r){
  const v = [r.hi, r.lit, r.mid, r.sh, r.dk];
  return new Set(v).size === v.length;
}

/* --- dithering -------------------------------------------------------------
   The hardware had no translucency, so a 50% anything was two solid colours in
   a checkerboard. Ordered dithering with a 4x4 Bayer matrix gives the same
   effect at any ratio and is what the sky gradients and shadows use here. */
const BAYER4 = [
  [ 0,  8,  2, 10],
  [12,  4, 14,  6],
  [ 3, 11,  1,  9],
  [15,  7, 13,  5]
];
/* Fills a rect with `over` on `under`, mixed by ordered dither. ratio 0..1. */
function ditherRect(ctx, x, y, w, h, under, over, ratio){
  x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
  if (under){ ctx.fillStyle = under; ctx.fillRect(x, y, w, h); }
  const cut = Math.round(ratio * 16);
  if (cut <= 0) return;
  ctx.fillStyle = over;
  if (cut >= 16){ ctx.fillRect(x, y, w, h); return; }
  /* Indexed by absolute canvas position, not position within this rect. Keyed
     to the rect, a one-pixel-tall band only ever reads row 0 of the matrix and
     the dither collapses into vertical pinstripes — and a gradient drawn as a
     stack of thin bands is exactly that case. */
  for (let j = 0; j < h; j++)
    for (let i = 0; i < w; i++)
      if (BAYER4[(y + j) & 3][(x + i) & 3] < cut) ctx.fillRect(x + i, y + j, 1, 1);
}
/* A vertical gradient between two colours, dithered rather than blended —
   the Mega Drive sky. */
function ditherGradient(ctx, x, y, w, h, top, bottom, steps){
  steps = steps || h;
  const band = h / steps;
  for (let s = 0; s < steps; s++){
    const t = steps === 1 ? 0 : s / (steps - 1);
    const y0 = Math.round(y + s * band), y1 = Math.round(y + (s + 1) * band);
    ditherRect(ctx, x, y0, w, y1 - y0, top, bottom, t);
  }
}

/* --- a character's palette --------------------------------------------------
   Every colour is still snapped to the console's 512. That is what holds the
   art together across characters and stages, and it costs nothing.

   The hard sixteen-per-sprite limit is not kept. It capped the ceiling rather
   than creating the look: sixteen colours cannot carry a hoodie, jeans, a
   beard, a hat, slippers and a spoon, and the art this is aiming at is modern
   pixel work rather than something a 1992 console had to fit in VRAM.

   A budget still exists, generously, so that colours are spent deliberately
   instead of accumulating. A fighter drifting past it means some material
   wants sharing, not that the limit wants raising. Asserted in the tests. */
const PALETTE_BUDGET = 24;
const OUTLINE = "#14141f";

/* Core materials every fighter has, plus any extras it declares. An extra
   gets as many tones as it earns: three for something that carries form,
   two for a flat accent. */
function characterPalette(pal, extras){
  const skin = ramp(pal.skin), suit = ramp(pal.suit),
        hair = ramp(pal.hair), trim = ramp(pal.trim);
  const out = {
    /* outline, doubling as the eye */
    line:    md(OUTLINE),
    skinDk:  skin.sh,  skinMid: skin.mid, skinLit: skin.lit, skinHi:  skin.hi,
    /* the outfit carries most of the form, so it gets the longest ramp */
    suitDk:  suit.dk,  suitSh:  suit.sh,  suitMid: suit.mid,
    suitLit: suit.lit, suitHi:  suit.hi,
    hairDk:  hair.dk,  hairMid: hair.mid, hairLit: hair.lit,
    /* boots, gloves, belt */
    trimMid: trim.mid, trimLit: trim.lit,
    /* the cool rim that lifts the silhouette off the background */
    rim:     suit.rim
  };
  for (const name in (extras || {})){
    const spec = extras[name], r = ramp(spec.hex), n = spec.tones || 2;
    out[name + "Mid"] = r.mid;
    if (n >= 2) out[name + "Lit"] = r.lit;
    if (n >= 3) out[name + "Dk"]  = r.sh;
    if (n >= 4) out[name + "Hi"]  = r.hi;
  }
  return out;
}
const paletteSize = p => new Set(Object.values(p)).size;

/* --- Bindings and saved preferences ---------------------------------------
   Every input source — keyboard, gamepad, on-screen pad — is reduced to the
   same bitmask, so the game itself never learns which one you used.        */

const ACTIONS = [
  ["up",   "Up / jump",     IN_UP],
  ["down", "Down / crouch", IN_DOWN],
  ["left", "Left",          IN_LEFT],
  ["right","Right",         IN_RIGHT],
  ["lp",   "Light punch",   IN_LP],
  ["mp",   "Medium punch",  IN_MP],
  ["hp",   "Heavy punch",   IN_HP],
  ["lk",   "Light kick",    IN_LK],
  ["mk",   "Medium kick",   IN_MK],
  ["hk",   "Heavy kick",    IN_HK]
];
const DEFAULT_BINDS = {
  p1: { up:"KeyW", down:"KeyS", left:"KeyA", right:"KeyD",
        lp:"KeyT", mp:"KeyY", hp:"KeyU", lk:"KeyG", mk:"KeyH", hk:"KeyJ" },
  p2: { up:"ArrowUp", down:"ArrowDown", left:"ArrowLeft", right:"ArrowRight",
        lp:"KeyI", mp:"KeyO", hp:"KeyP", lk:"KeyK", mk:"KeyL", hk:"Semicolon" }
};

/* Preferences live in localStorage, which throws outright in some privacy
   modes — so every access is guarded and the game runs fine without it. */
const STORE_KEY = "ironcircuit.settings.v1";
const Settings = {
  binds: JSON.parse(JSON.stringify(DEFAULT_BINDS)),
  muted:false, diff:"normal", p1:"kestrel", p2:"brick", touchMode:"auto",
  load(){
    let raw = null;
    try { raw = localStorage.getItem(STORE_KEY); } catch(e){ return; }
    if (!raw) return;
    let o; try { o = JSON.parse(raw); } catch(e){ return; }
    if (!o || typeof o !== "object") return;
    for (const side of ["p1","p2"])
      if (o.binds && o.binds[side])
        for (const [act] of ACTIONS)
          if (typeof o.binds[side][act] === "string") this.binds[side][act] = o.binds[side][act];
    if (typeof o.muted === "boolean") this.muted = o.muted;
    if (["easy","normal","hard"].includes(o.diff)) this.diff = o.diff;
    if (typeof o.p1 === "string" && CHAR_KEYS.includes(o.p1)) this.p1 = o.p1;
    if (typeof o.p2 === "string" && CHAR_KEYS.includes(o.p2)) this.p2 = o.p2;
    if (["auto","on","off"].includes(o.touchMode)) this.touchMode = o.touchMode;
  },
  save(){
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        binds:this.binds, muted:this.muted, diff:this.diff,
        p1:this.p1, p2:this.p2, touchMode:this.touchMode
      }));
    } catch(e){ /* storage unavailable or full — preferences just won't stick */ }
  },
  resetBinds(){ this.binds = JSON.parse(JSON.stringify(DEFAULT_BINDS)); rebuildMaps(); this.save(); }
};

let KEYMAP_P1 = {}, KEYMAP_P2 = {}, KEYMAP_SOLO = {};
function rebuildMaps(){
  KEYMAP_P1 = {}; KEYMAP_P2 = {};
  for (const [act,, bit] of ACTIONS){
    const a = Settings.binds.p1[act], b = Settings.binds.p2[act];
    if (a) KEYMAP_P1[a] = bit;
    if (b) KEYMAP_P2[b] = bit;
  }
  /* In one-local-player modes we accept either layout, so nobody has to learn
     the "wrong" side of the keyboard. */
  KEYMAP_SOLO = Object.assign({}, KEYMAP_P1, KEYMAP_P2, {
    Numpad4:IN_LEFT, Numpad6:IN_RIGHT, Numpad8:IN_UP, Numpad2:IN_DOWN
  });
}
/* Which player, if any, already uses this key. */
function bindConflict(code, side, action){
  for (const s of ["p1","p2"])
    for (const [act] of ACTIONS)
      if (Settings.binds[s][act] === code && !(s === side && act === action)) return { side:s, act };
  return null;
}
const KEY_LABELS = { Semicolon:";", Comma:",", Period:".", Slash:"/", Quote:"'",
  BracketLeft:"[", BracketRight:"]", Backslash:"\\", Minus:"-", Equal:"=", Backquote:"`",
  Space:"SPACE", ShiftLeft:"L SHIFT", ShiftRight:"R SHIFT", ControlLeft:"L CTRL",
  ControlRight:"R CTRL", AltLeft:"L ALT", AltRight:"R ALT", Enter:"ENTER", Backspace:"BKSP" };
function keyLabel(code){
  if (!code) return "—";
  if (KEY_LABELS[code]) return KEY_LABELS[code];
  return code.replace(/^Key|^Digit/, "").replace(/^Arrow/, "").replace(/^Numpad/, "NUM ").toUpperCase();
}

const Input = {
  down: Object.create(null),
  capturing: false,      /* true while the settings screen is grabbing a key */
  swallow: new Set(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space","Tab"]),
  init(){
    addEventListener("keydown", e => {
      if (e.repeat || this.capturing) return;
      this.down[e.code] = true;
      if (this.swallow.has(e.code)) e.preventDefault();
      Sfx.unlock();
    });
    addEventListener("keyup", e => { this.down[e.code] = false; });
    addEventListener("blur", () => { this.down = Object.create(null); });
  },
  read(map){
    let m = 0;
    for (const code in map) if (this.down[code]) m |= map[code];
    return m;
  },
  isDown(code){ return !!this.down[code]; }
};

/* Opposite directions cancel, so a stuck key, a drifting stick and a thumb
   sliding across the pad can never wedge a fighter. Applied once, after all
   the input sources for a player have been merged. */
function cleanMask(m){
  if ((m & IN_LEFT) && (m & IN_RIGHT)) m &= ~(IN_LEFT|IN_RIGHT);
  if ((m & IN_UP)   && (m & IN_DOWN))  m &= ~IN_UP;
  return m;
}

/* --- Gamepads --------------------------------------------------------------
   Standard-mapping layout, arranged the way a fight pad usually is: the face
   buttons are the light and medium attacks, the shoulders the heavies.     */
const PAD_DEADZONE = 0.45;
const Pad = {
  connected(){
    const gp = navigator.getGamepads ? navigator.getGamepads() : [];
    let n = 0;
    for (const g of gp) if (g) n++;
    return n;
  },
  readOne(g){
    if (!g) return 0;
    let m = 0;
    const ax = g.axes[0] || 0, ay = g.axes[1] || 0;
    if (ax < -PAD_DEADZONE) m |= IN_LEFT; else if (ax > PAD_DEADZONE) m |= IN_RIGHT;
    if (ay < -PAD_DEADZONE) m |= IN_UP;   else if (ay > PAD_DEADZONE) m |= IN_DOWN;
    const b = i => !!(g.buttons[i] && g.buttons[i].pressed);
    if (b(12)) m |= IN_UP;   if (b(13)) m |= IN_DOWN;
    if (b(14)) m |= IN_LEFT; if (b(15)) m |= IN_RIGHT;
    if (b(2)) m |= IN_LP;  if (b(3)) m |= IN_MP;  if (b(5) || b(4)) m |= IN_HP;
    if (b(0)) m |= IN_LK;  if (b(1)) m |= IN_MK;  if (b(7) || b(6)) m |= IN_HK;
    return m;
  },
  /* nth connected pad, so unplugging one does not shuffle the others */
  read(slot){
    const gp = navigator.getGamepads ? navigator.getGamepads() : [];
    let i = 0;
    for (const g of gp){ if (!g) continue; if (i++ === slot) return this.readOne(g); }
    return 0;
  },
  readAny(){
    const gp = navigator.getGamepads ? navigator.getGamepads() : [];
    let m = 0;
    for (const g of gp) if (g) m |= this.readOne(g);
    return m;
  }
};

/* --- On-screen controls ----------------------------------------------------
   A round pad rather than four arrow buttons: a quarter-circle is a thumb
   sweep, which is the only way special moves are playable on glass. Multiple
   pointers are tracked at once so you can hold a direction and press.      */
const Touch = {
  active:false, mask:0, pointers:new Map(), root:null, pad:null, nub:null, btns:[],
  init(){
    this.root = document.getElementById("touch");
    if (!this.root) return;
    this.root.innerHTML =
      '<div id="tpad"><div id="tnub"></div></div>' +
      '<div id="tbtns">' +
        '<div class="tbtn p" data-bit="' + IN_LP + '">LP</div>' +
        '<div class="tbtn p" data-bit="' + IN_MP + '">MP</div>' +
        '<div class="tbtn p" data-bit="' + IN_HP + '">HP</div>' +
        '<div class="tbtn k" data-bit="' + IN_LK + '">LK</div>' +
        '<div class="tbtn k" data-bit="' + IN_MK + '">MK</div>' +
        '<div class="tbtn k" data-bit="' + IN_HK + '">HK</div>' +
      '</div>' +
      '<div id="thint">Rotate for a bigger screen</div>' +
      '<div id="tpause">II</div>';
    this.pad  = this.root.querySelector("#tpad");
    this.nub  = this.root.querySelector("#tnub");
    this.btns = Array.from(this.root.querySelectorAll(".tbtn"));
    const pause = this.root.querySelector("#tpause");

    const onDown = e => {
      if (e.target === pause){ e.preventDefault(); Sfx.unlock(); togglePause(); return; }
      Sfx.unlock();
      e.preventDefault();
      this.pointers.set(e.pointerId, 0);
      this.track(e);
    };
    const onMove = e => { if (this.pointers.has(e.pointerId)){ e.preventDefault(); this.track(e); } };
    const onUp = e => {
      if (!this.pointers.has(e.pointerId)) return;
      e.preventDefault();
      this.pointers.delete(e.pointerId);
      this.recompute();
    };
    this.root.addEventListener("pointerdown", onDown, { passive:false });
    this.root.addEventListener("pointermove", onMove, { passive:false });
    this.root.addEventListener("pointerup", onUp, { passive:false });
    this.root.addEventListener("pointercancel", onUp, { passive:false });
    this.root.addEventListener("contextmenu", e => e.preventDefault());
  },
  track(e){
    let bits = 0;
    const pr = this.pad.getBoundingClientRect();
    const cx = pr.left + pr.width/2, cy = pr.top + pr.height/2;
    const dx = e.clientX - cx, dy = e.clientY - cy;
    const r = Math.hypot(dx, dy);
    /* Generous catch radius: the thumb wanders off the drawn circle. */
    if (r < pr.width * 0.95){
      if (r > pr.width * 0.16){
        const oct = ((Math.round(Math.atan2(-dy, dx) / (Math.PI/4)) % 8) + 8) % 8;
        bits |= [IN_RIGHT, IN_RIGHT|IN_UP, IN_UP, IN_UP|IN_LEFT,
                 IN_LEFT, IN_LEFT|IN_DOWN, IN_DOWN, IN_DOWN|IN_RIGHT][oct];
      }
    } else {
      for (const b of this.btns){
        const br = b.getBoundingClientRect();
        const bx = br.left + br.width/2, by = br.top + br.height/2;
        if (Math.hypot(e.clientX - bx, e.clientY - by) < br.width * 0.72)
          bits |= parseInt(b.dataset.bit, 10);
      }
    }
    this.pointers.set(e.pointerId, bits);
    this.recompute();
  },
  recompute(){
    let m = 0;
    for (const bits of this.pointers.values()) m |= bits;
    this.mask = m;
    for (const b of this.btns) b.classList.toggle("on", !!(m & parseInt(b.dataset.bit, 10)));
    if (this.nub){
      const dx = (m & IN_LEFT) ? -1 : (m & IN_RIGHT) ? 1 : 0;
      const dy = (m & IN_UP)   ? -1 : (m & IN_DOWN)  ? 1 : 0;
      this.nub.style.transform = "translate(" + (dx*52) + "%," + (dy*52) + "%)";
    }
  },
  read(){ return this.mask; },
  apply(){
    const want = Settings.touchMode === "on" ? true
               : Settings.touchMode === "off" ? false
               : (matchMedia("(pointer: coarse)").matches || "ontouchstart" in window);
    this.active = want;
    document.body.classList.toggle("touch", want);
    if (!want){ this.pointers.clear(); this.mask = 0; }
    if (typeof fit === "function") fit();
  }
};

/* --- Motion inputs --------------------------------------------------------
   Directions are reduced to numpad notation relative to the fighter's facing
   (6 is always "toward the opponent"). A rolling history of the last frames
   lets us recognise quarter-circles, dragon-punch motions and charges the way
   the arcade games do — leniently, and without demanding exact frames.      */

function numpadDir(mask, facing){
  const fwd = facing > 0 ? IN_RIGHT : IN_LEFT;
  const bck = facing > 0 ? IN_LEFT  : IN_RIGHT;
  let h = (mask & fwd) ? 1 : (mask & bck) ? -1 : 0;
  let v = (mask & IN_UP) ? 1 : (mask & IN_DOWN) ? -1 : 0;
  return 5 + h + v * 3;   /* 1..9, 5 = neutral */
}

const MOTION_WINDOW = 14;    /* frames a motion may span */
const CHARGE_FRAMES = 42;    /* frames a charge must be held */

class MotionBuffer {
  constructor(){ this.dirs = []; this.chargeBack = 0; this.chargeDown = 0; this.releasedBack = 99; this.releasedDown = 99; }
  push(dir){
    this.dirs.push(dir);
    if (this.dirs.length > 40) this.dirs.shift();
    /* Charge tracking: holding back/down-back builds a horizontal charge,
       holding any down builds a vertical one. */
    if (dir === 4 || dir === 1 || dir === 7) this.chargeBack++;
    else { if (this.chargeBack >= CHARGE_FRAMES) this.releasedBack = 0; this.chargeBack = 0; }
    if (dir === 2 || dir === 1 || dir === 3) this.chargeDown++;
    else { if (this.chargeDown >= CHARGE_FRAMES) this.releasedDown = 0; this.chargeDown = 0; }
    this.releasedBack++; this.releasedDown++;
  }
  /* Was this ordered sequence of directions walked through recently?
     Extra directions in between are tolerated; order is not. */
  has(seq){
    const n = this.dirs.length;
    const start = Math.max(0, n - MOTION_WINDOW);
    let si = 0;
    for (let i = start; i < n && si < seq.length; i++){
      if (seq[si].includes(this.dirs[i])) si++;
    }
    return si === seq.length;
  }
  qcf(){ return this.has([[2],[3],[6]]); }                 /* down, down-fwd, fwd */
  qcb(){ return this.has([[2],[1],[4]]); }                 /* down, down-back, back */
  dp(){  return this.has([[6],[2,3],[3]]); }               /* fwd, down, down-fwd */
  hcf(){ return this.has([[4],[1],[2],[3],[6]]); }         /* half circle forward */
  doubleQcf(){ return this.has([[2],[3],[6],[2],[3],[6]]); }
  chargedFwd(){ return this.releasedBack <= 11 && (this.dirs[this.dirs.length-1] === 6 || this.dirs[this.dirs.length-1] === 9 || this.dirs[this.dirs.length-1] === 3); }
  chargedUp(){  return this.releasedDown <= 11 && this.dirs[this.dirs.length-1] >= 7; }
  consumeCharge(kind){ if (kind === "back") this.releasedBack = 99; else this.releasedDown = 99; }
  reset(){ this.dirs.length = 0; }
}

/* ============================================================================
   THE RIG — poses and animation
   ----------------------------------------------------------------------------
   Rather than ship thousands of hand-drawn frames, every fighter is drawn from
   the same jointed rig: a pose is a set of joint positions in low-res pixels,
   measured from the point between the feet, with y negative upward. The
   renderer draws thick pixel limbs between the joints, so the result reads as
   chunky pixel art while the animation data stays small, readable and easy to
   tune. Characters differ by palette, proportions, stats and move properties.

   Joints:  pv pelvis · nk neck · hd head
            sF/eF/hF  front shoulder, elbow, hand      (front = toward opponent)
            sB/eB/hB  back  shoulder, elbow, hand

   ----------------------------------------------------------------------------

   before the hitbox appears, active frames while it is out, recovery frames
   before you can act again. Hitboxes are given in rig space (origin between
   the feet, y negative upward, facing right) and mirrored with the fighter.

          "low"      must be blocked crouching
          "overhead" must be blocked standing
          "throw"    unblockable, requires proximity
   ========================================================================== */

function mkMove(o){
  const m = Object.assign({
    type:"normal", level:"mid", stance:"stand",
    startup:5, active:4, recovery:10,
    dmg:10, chip:0, hitstun:14, blockstun:10,
    pushHit:520, pushBlock:340, launch:0, knockdown:false,

    meterHit:26, meterBlock:10, meterWhiff:4,
    invuln:0, moveX:0, moveY:0, air:false, sfx:"punch",
    poses:[POSE.idle1, POSE.idle1, POSE.idle1], hit:null, onActive:null
  }, o);
  const p = m.poses;
  m.anim = { loop:false, frames:[
    [p[0], m.startup],
    [p[1], m.active],
    [p[2] !== undefined ? p[2] : p[1], m.recovery]
  ]};
  m.total = m.startup + m.active + m.recovery;
  return m;
}

const GLYPH_ROWS = {};
for (const c in GLYPHS) GLYPH_ROWS[c] = GLYPHS[c].split("/");

function textWidth(str, sc=1, sp=1){ return str.length * (5 + sp) * sc - sp * sc; }

function drawText(ctx, str, x, y, color, sc=1, sp=1){
  str = String(str).toUpperCase();
  ctx.fillStyle = color;
  let cx = x;
  for (let i = 0; i < str.length; i++){
    const rows = GLYPH_ROWS[str[i]] || GLYPH_ROWS["?"];
    for (let r = 0; r < 7; r++){
      const row = rows[r];
      let run = -1;
      for (let c = 0; c <= 5; c++){
        const on = c < 5 && row[c] === "#";
        if (on && run < 0) run = c;
        else if (!on && run >= 0){ ctx.fillRect(cx + run*sc, y + r*sc, (c-run)*sc, sc); run = -1; }
      }
    }
    cx += (5 + sp) * sc;
  }
}
function drawTextC(ctx, str, cx, y, color, sc=1, sp=1){
  drawText(ctx, str, Math.round(cx - textWidth(String(str), sc, sp)/2), y, color, sc, sp);
}
function drawTextShadow(ctx, str, x, y, color, shadow, sc=1, sp=1){
  drawText(ctx, str, x + sc, y + sc, shadow, sc, sp);
  drawText(ctx, str, x, y, color, sc, sp);
}

/* ============================================================================
   FIGHTER SPRITE RENDERING
   ----------------------------------------------------------------------------
   A pose is rasterised into a small offscreen canvas and cached, keyed by
   character + pose + facing + tint. Poses are held for several frames at a
   time, so in practice each unique frame is drawn once for the whole match.
   ========================================================================== */

const SPRITE_W = 150, SPRITE_H = 130, SPRITE_OX = 75, SPRITE_OY = 112;
const spriteCache = new Map();

/* Chunky capsule between two points: stamps square pixels along the segment
   so edges stay hard instead of antialiasing into mush. */
function limb(ctx, x0, y0, x1, y1, t, color){
  const dx = x1 - x0, dy = y1 - y0;
  const steps = Math.max(Math.abs(dx), Math.abs(dy), 1);
  const h = t >> 1;
  ctx.fillStyle = color;
  for (let i = 0; i <= steps; i++){
    const x = Math.round(x0 + dx * i / steps) - h;
    const y = Math.round(y0 + dy * i / steps) - h;
    ctx.fillRect(x, y, t, t);
  }
}
function blob(ctx, x, y, w, h, color){
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x - w/2), Math.round(y - h/2), w, h);
}
/* Rectangle with the four corner pixels knocked out — reads as "round" at
   this resolution without any antialiasing. */
function roundRect(ctx, x, y, w, h, color){
  ctx.fillStyle = color;
  ctx.fillRect(x + 1, y, w - 2, h);
  ctx.fillRect(x, y + 1, w, h - 2);
}

/* A limb shaded as a cylinder.

   Passes, back to front: a cool rim offset away from the light, then the
   shadow side at full width, then progressively narrower bands stepped
   towards the light. Those offsets are the whole trick — they turn a flat
   capsule into something with a round side, which is the difference between
   this and the two-tone version it replaces. It costs nothing at draw time
   because every pose is rasterised once and cached. */
function limbShaded(ctx, x0, y0, x1, y1, t, tn, lx, ly){
  if (tn.rim && t >= 5) limb(ctx, x0 - lx, y0 - ly, x1 - lx, y1 - ly, t, tn.rim);
  limb(ctx, x0, y0, x1, y1, t, tn.sh);
  if (t >= 4)  limb(ctx, x0 + lx,     y0 + ly,     x1 + lx,     y1 + ly,     t - 2, tn.mid);
  if (t >= 7)  limb(ctx, x0 + lx*2,   y0 + ly*2,   x1 + lx*2,   y1 + ly*2,   t - 4, tn.lit);
  if (t >= 14) limb(ctx, x0 + lx*3,   y0 + ly*3,   x1 + lx*3,   y1 + ly*3,   t - 8, tn.hi);
}

function buildSprite(ch, pose, facing, tint){
  const cv = document.createElement("canvas");
  cv.width = SPRITE_W; cv.height = SPRITE_H;
  const c = cv.getContext("2d");
  const sc = ch.scale, b = ch.bulk, P = ch.p16;
  const J = {};
  for (const k in pose){
    J[k] = [ SPRITE_OX + facing * Math.round(pose[k][0] * sc),
             SPRITE_OY + Math.round(pose[k][1] * sc) ];
  }
  const hipF = [ J.pv[0] + facing * 3, J.pv[1] + 1 ];
  const hipB = [ J.pv[0] - facing * 3, J.pv[1] + 1 ];

  const wUA = 6 + b, wFA = 5 + b, wTH = 9 + b, wSH = 7 + b, wTO = 16 + b*2;
  const headW = 14 + (b > 0 ? 2 : 0), headH = 15 + (b > 0 ? 1 : 0);

  /* The key light sits in front of the fighter and above, so it follows the
     facing: turn around and the lit side turns with you, exactly as it does
     when a hand-drawn sprite sheet is mirrored. */
  const lx = facing, ly = -1;

  /* On a hit the whole fighter flashes white for a few frames. Swapping the
     tone sets rather than compositing keeps it a two-colour sprite. */
  const W_ = "#ffffff";
  const flash = tint === "flash";
  const set = (rim, sh, mid, lit, hi) => flash
    ? { rim:null, sh:W_, mid:W_, lit:W_, hi:W_ }
    : { rim, sh, mid, lit, hi };
  const suitF = set(P.rim, P.suitSh, P.suitMid, P.suitLit, P.suitHi);
  const suitB = set(null,  P.suitDk, P.suitSh,  P.suitMid, P.suitLit);
  /* The rig drew the whole body from one material, which is fine for a gi and
     wrong for anyone wearing a top and trousers. A character that declares a
     `pants` material gets it on the legs. */
  const pantsF = P.pantsMid
    ? set(P.rim, P.pantsDk || P.pantsMid, P.pantsMid, P.pantsLit || P.pantsMid, P.pantsLit || P.pantsMid)
    : suitF;
  const pantsB = P.pantsMid
    ? set(null, P.pantsDk || P.pantsMid, P.pantsDk || P.pantsMid, P.pantsMid, P.pantsLit || P.pantsMid)
    : suitB;
  const skinF = set(P.rim, P.skinDk, P.skinMid, P.skinLit, P.skinHi);
  const skinB = set(null,  P.skinDk, P.skinDk,  P.skinMid, P.skinLit);
  const col = x => flash ? W_ : x;
  const OL = flash ? W_ : P.line;

  /* Kit a character carries that the shared rig knows nothing about. Because
     the rig is joint-based, all of it follows the pose for free — a weapon
     drawn along the forearm vector is correct in all 54 frames without any
     of them being redrawn. That is cheap here and expensive on a hand-drawn
     sheet, which is worth remembering when deciding what a fighter holds. */
  const G = ch.gear || {};
  const footW = G.bigFeet ? 13 : 9, footH = G.bigFeet ? 6 : 4;
  const footMid = G.bigFeet ? P.pawMid : P.trimMid;
  const footLit = G.bigFeet ? P.pawLit : P.trimLit;

  /* Pass 1: silhouette outline, one pixel fatter than every part. */
  limb(c, J.sB[0],J.sB[1], J.eB[0],J.eB[1], wUA+2, OL);
  limb(c, J.eB[0],J.eB[1], J.hB[0],J.hB[1], wFA+2, OL);
  limb(c, hipB[0],hipB[1], J.kB[0],J.kB[1], wTH+2, OL);
  limb(c, J.kB[0],J.kB[1], J.fB[0],J.fB[1], wSH+2, OL);
  limb(c, J.pv[0],J.pv[1], J.nk[0],J.nk[1], wTO+2, OL);
  limb(c, hipF[0],hipF[1], J.kF[0],J.kF[1], wTH+2, OL);
  limb(c, J.kF[0],J.kF[1], J.fF[0],J.fF[1], wSH+2, OL);
  limb(c, J.sF[0],J.sF[1], J.eF[0],J.eF[1], wUA+2, OL);
  limb(c, J.eF[0],J.eF[1], J.hF[0],J.hF[1], wFA+2, OL);
  blob(c, J.hd[0], J.hd[1], headW+2, headH+2, OL);
  blob(c, J.fF[0]+facing*2, J.fF[1], footW+2, footH+2, OL);
  blob(c, J.fB[0]+facing*2, J.fB[1], footW+2, footH+2, OL);
  if (G.hood) blob(c, J.nk[0] - facing*5, J.nk[1] + 2, 15, 12, OL);

  /* Pass 2: the parts, back to front. The far arm and leg use tones one step
     down the ramp, which is how a sprite this small says "behind". */
  limbShaded(c, J.sB[0],J.sB[1], J.eB[0],J.eB[1], wUA, suitB, lx, ly);
  limbShaded(c, J.eB[0],J.eB[1], J.hB[0],J.hB[1], wFA-1, skinB, lx, ly);
  blob(c, J.hB[0], J.hB[1], wFA+1, wFA+1, col(P.skinDk));
  limbShaded(c, hipB[0],hipB[1], J.kB[0],J.kB[1], wTH, pantsB, lx, ly);
  limbShaded(c, J.kB[0],J.kB[1], J.fB[0],J.fB[1], wSH, pantsB, lx, ly);
  blob(c, J.fB[0]+facing*2, J.fB[1], footW-2, footH-1, col(G.bigFeet ? P.pawDk : P.trimMid));
  if (G.hood){
    blob(c, J.nk[0] - facing*5, J.nk[1] + 2, 13, 10, col(P.suitSh));
    blob(c, J.nk[0] - facing*6, J.nk[1] + 1, 9, 7, col(P.suitDk));
  }

  /* torso */
  limbShaded(c, J.pv[0],J.pv[1], J.nk[0],J.nk[1], wTO, suitF, lx, ly);
  /* belt, with its own lit edge so it reads as a band and not a smear */
  blob(c, J.pv[0], J.pv[1] + 1, wTO, 4, col(P.trimMid));
  blob(c, J.pv[0] + lx, J.pv[1], wTO - 4, 1, col(P.trimLit));

  /* neck sits in the chin's shadow */
  blob(c, J.nk[0], J.nk[1] + 3, 7, 5, col(P.skinDk));

  /* head */
  const hx = J.hd[0] - (headW>>1), hy = J.hd[1] - (headH>>1);
  roundRect(c, hx, hy, headW, headH, col(P.skinMid));
  if (!flash){
    /* lit on the side the light comes from, shaded on the other */
    c.fillStyle = P.skinLit;
    c.fillRect(facing > 0 ? hx + headW - 5 : hx + 1, hy + 4, 4, headH - 7);
    c.fillStyle = P.skinDk;
    c.fillRect(facing > 0 ? hx : hx + headW - 1, hy + 3, 1, headH - 5);
    c.fillRect(hx + 1, hy + headH - 3, headW - 2, 2);            /* jaw */
    /* a single lit pixel column at nose height reads as a profile */
    c.fillStyle = P.skinHi;
    c.fillRect(J.hd[0] + facing * ((headW>>1) - 1), hy + 7, 1, 2);
  }
  /* beard first, so the hat and hair sit over it */
  if (G.beard && !flash){
    c.fillStyle = P.hairMid;
    c.fillRect(facing > 0 ? hx + 1 : hx + 1, hy + 9, headW - 2, headH - 9);
    c.fillRect(facing > 0 ? hx + headW - 2 : hx, hy + 8, 2, 4);
    c.fillStyle = P.hairDk;
    c.fillRect(hx + 1, hy + headH - 2, headW - 2, 2);
    c.fillStyle = P.hairLit;
    c.fillRect(facing > 0 ? hx + headW - 4 : hx + 2, hy + 10, 2, 3);
  }
  if (G.hat){
    /* A novelty animal hat: bright, eared, and deliberately its own animal —
       longer swept-back ears with brown tips, a pale snout patch and a side
       stripe rather than round cheeks. */
    const brim = facing > 0 ? hx + headW - 2 : hx - 3;
    c.fillStyle = OL; c.fillRect(brim - (facing > 0 ? 0 : 2), hy + 3, 5, 3);
    c.fillStyle = col(P.hatDk); c.fillRect(brim - (facing > 0 ? 0 : 1), hy + 3, 4, 2);
    c.fillStyle = OL; c.fillRect(hx - 1, hy - 4, headW + 2, 10);
    roundRect(c, hx, hy - 3, headW, 8, col(P.hatMid));
    if (!flash){
      c.fillStyle = P.hatLit; c.fillRect(hx + 2, hy - 3, headW - 4, 2);
      c.fillStyle = P.hatDk;  c.fillRect(hx + 1, hy + 3, headW - 2, 2);
      /* side stripe and pale snout: the two marks that make him his own
         animal rather than a recognisable one */
      c.fillStyle = P.pawDk;  c.fillRect(facing > 0 ? hx + 2 : hx + headW - 5, hy - 1, 3, 2);
      c.fillStyle = P.skinHi; c.fillRect(facing > 0 ? hx + headW - 4 : hx + 1, hy - 1, 3, 3);
    }
    /* Ears: wide at the base, six steps tall, swept back off the facing.
       Longer than this and they stop reading as ears and start reading as
       antennae. */
    const ear = (bx) => {
      const draw = (pass) => {
        for (let i = 0; i < 6; i++){
          const w = Math.max(2, 6 - i);
          const x = Math.round(bx - facing * i * 0.9) - (w >> 1);
          if (pass === 0){ c.fillStyle = OL; c.fillRect(x - 1, hy - 5 - i*2, w + 2, 3); }
          else {
            c.fillStyle = col(i >= 4 ? P.pawDk : i < 2 ? P.hatLit : P.hatMid);
            c.fillRect(x, hy - 5 - i*2, w, 2);
          }
        }
      };
      draw(0); draw(1);
    };
    ear(hx + 3); ear(hx + headW - 4);
  } else {
    /* hair: cap across the crown, wedge down the back of the skull */
    roundRect(c, hx, hy, headW, 5, col(P.hairMid));
    if (!flash){
      c.fillStyle = P.hairLit;
      c.fillRect(facing > 0 ? hx + 4 : hx + 2, hy + 1, headW - 6, 1);
      c.fillStyle = P.hairDk;
      c.fillRect(facing > 0 ? hx : hx + headW - 2, hy + 1, 2, 4);
    }
    c.fillStyle = col(P.hairMid);
    c.fillRect(facing > 0 ? hx : hx + headW - 3, hy + 4, 3, 5);
  }
  if (!flash){
    c.fillStyle = P.line;
    c.fillRect(J.hd[0] + facing * 2, hy + 7, 2, 3);              /* eye */
  }

  /* front leg and front arm carry the key light */
  limbShaded(c, hipF[0],hipF[1], J.kF[0],J.kF[1], wTH, pantsF, lx, ly);
  limbShaded(c, J.kF[0],J.kF[1], J.fF[0],J.fF[1], wSH, pantsF, lx, ly);
  blob(c, J.fF[0]+facing*2, J.fF[1], footW, footH, col(footMid));
  blob(c, J.fF[0]+facing*2, J.fF[1]-1, footW-2, 1, col(footLit));
  if (G.bigFeet && !flash){
    c.fillStyle = P.pawDk;
    for (let t = 0; t < 3; t++)
      c.fillRect(J.fF[0] + facing*(3 + t*3) - 1, J.fF[1] - 1, 2, 2);
  }
  limbShaded(c, J.sF[0],J.sF[1], J.eF[0],J.eF[1], wUA, suitF, lx, ly);
  limbShaded(c, J.eF[0],J.eF[1], J.hF[0],J.hF[1], wFA, skinF, lx, ly);
  blob(c, J.hF[0], J.hF[1], wFA+3, wFA+3, col(P.skinMid));
  blob(c, J.hF[0] + lx, J.hF[1] + ly, wFA, wFA, col(P.skinLit));

  /* The weapon rides the forearm vector, so it is correct in every pose. */
  if (G.weapon === "spoon"){
    const dx = J.hF[0] - J.eF[0], dy = J.hF[1] - J.eF[1];
    const len = Math.hypot(dx, dy) || 1;
    const ux = dx / len, uy = dy / len;
    const tx = J.hF[0] + ux * 12, ty = J.hF[1] + uy * 12;
    limb(c, J.hF[0], J.hF[1], tx, ty, 4, OL);
    blob(c, tx, ty, 8, 7, OL);
    limb(c, J.hF[0] + ux*2, J.hF[1] + uy*2, tx - ux*3, ty - uy*3, 2, col(P.spoonMid));
    blob(c, tx, ty, 6, 5, col(P.spoonMid));
    blob(c, tx - ux, ty - uy - 1, 4, 3, col(P.spoonLit));
  }
  return cv;
}

let spriteKeyCounter = 0;
function poseKey(pose){
  if (pose.__k === undefined) Object.defineProperty(pose, "__k", { value: ++spriteKeyCounter });
  return pose.__k;
}
function getSprite(ch, pose, facing, tint){
  const key = ch.key + "|" + poseKey(pose) + "|" + facing + "|" + (tint||"");
  let s = spriteCache.get(key);
  if (!s){ s = buildSprite(ch, pose, facing, tint); spriteCache.set(key, s); }
  return s;
}

/* ============================================================================
   STAGES
   ----------------------------------------------------------------------------
   Each stage is baked once into a few parallax layers, then blitted per frame.
   Backgrounds are purely cosmetic and never touch the simulation.
   ========================================================================== */

function newLayer(w, h){
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  return cv;
}
/* Banded vertical gradient — stepped on purpose, so it dithers like pixel art
   instead of smearing like a CSS gradient. */
function bands(ctx, x, y, w, h, colors){
  const n = colors.length, step = h / n;
  for (let i = 0; i < n; i++){
    ctx.fillStyle = colors[i];
    ctx.fillRect(x, Math.round(y + i*step), w, Math.ceil(step) + 1);
  }
}
function noiseSpeckle(ctx, x, y, w, h, color, count, rng){
  ctx.fillStyle = color;
  for (let i = 0; i < count; i++)
    ctx.fillRect(x + rng() % w, y + rng() % h, 1, 1);
}

/* Three stages, built with the console's own toolkit: dithered gradients
   instead of blends, silhouettes in flat tone steps, and detail deliberately
   kept away from the band where the fighters stand. Atmospheric perspective
   does the depth — distant shapes are lighter and bluer, near ones darker and
   more saturated — which is how a 16-bit background reads as deep without
   ever leaving the palette. */
function buildStage(key){
  const rng = makeRNG(key.length * 7717 + 13);
  const far = newLayer(STAGE_W, H), near = newLayer(STAGE_W, H);
  /* Drawn AFTER the fighters and scrolled faster than the floor, so the world
     continues towards the camera instead of stopping at the fight plane. It is
     the cheapest depth cue there is and the engine had none of it. */
  const fore = newLayer(STAGE_W, H);
  const f = far.getContext("2d"), n = near.getContext("2d"), o = fore.getContext("2d");
  /* Things that move every frame rather than being baked: screens flickering,
     a crowd that reacts. Collected here and drawn by the renderer. */
  const props = { crowd: [], screens: [], lamps: [] };
  const FL = GROUND_Y;
  let floorTop, floorMid, floorBot, accent;
  const pick = a => a[rng() % a.length];

  if (key === "dockyard"){
    accent = md("#7fd8ff");
    /* Dusk, dithered through four hue steps rather than blended. */
    ditherGradient(f, 0, 0, STAGE_W, 46, md("#241a4e"), md("#4a2a63"));
    ditherGradient(f, 0, 46, STAGE_W, 44, md("#4a2a63"), md("#8a4668"));
    ditherGradient(f, 0, 90, STAGE_W, 34, md("#8a4668"), md("#c8705c"));
    ditherGradient(f, 0, 124, STAGE_W, 22, md("#c8705c"), md("#e8a86a"));
    /* A low sun and its glow, dithered outward. */
    const sunX = 250, sunY = 138;
    for (let r = 30; r > 0; r -= 3)
      ditherRect(f, sunX - r*2, sunY - r/2, r*4, r, null, md("#ffce90"), 1 - r/32);
    f.fillStyle = md("#ffe9a8"); f.fillRect(sunX - 13, sunY - 4, 26, 9);

    /* Distant cranes: pale and blue with distance. */
    for (let i = 0; i < 9; i++){
      const bx = 20 + i * 104 + (rng() % 50), bh = 40 + (rng() % 30);
      f.fillStyle = md("#6a5a86");
      f.fillRect(bx, FL - 44 - bh, 4, bh);
      f.fillRect(bx - 22, FL - 44 - bh, 52, 3);
      f.fillRect(bx + 24, FL - 44 - bh, 2, 12);
    }
    /* Water, with a dithered band of reflected sun. */
    ditherGradient(f, 0, FL - 44, STAGE_W, 28, md("#3a5c86"), md("#1e2f52"));
    for (let i = 0; i < 260; i++){
      const yy = FL - 44 + (rng() % 26);
      const near_ = (yy - (FL - 44)) / 26;
      f.fillStyle = (rng() % 5) ? md("#4a74a0") : md("#e8a86a");
      f.fillRect(rng() % STAGE_W, yy, 2 + (rng() % (near_ > 0.5 ? 6 : 3)), 1);
    }

    /* Containers, each a three-tone box with a lit top edge. */
    const cols = ["#b8442f","#2f6fb8","#c9a021","#3a8c5c","#7a3fa0","#c25e1e"];
    for (let i = 0; i < 30; i++){
      const cw = 44 + (rng()%22), chh = 22, cx = (rng() % (STAGE_W - 60)), stack = 1 + (rng() % 3);
      const R = ramp(pick(cols));
      for (let s2 = 0; s2 < stack; s2++){
        const cy = FL - 22 - chh*(s2+1);
        n.fillStyle = md("#14141f"); n.fillRect(cx-1, cy-1, cw+2, chh+2);
        n.fillStyle = R.sh;  n.fillRect(cx, cy, cw, chh);
        n.fillStyle = R.mid; n.fillRect(cx, cy, cw, chh - 4);
        n.fillStyle = R.lit; n.fillRect(cx, cy, cw, 2);
        n.fillStyle = R.dk;
        for (let r = 4; r < cw - 3; r += 5) n.fillRect(cx + r, cy + 3, 2, chh - 7);
      }
    }
    /* The dock wall the fighters stand in front of: dark, so the sprites pop. */
    ditherGradient(n, 0, FL - 24, STAGE_W, 26, md("#2a1f2c"), md("#140f18"));
    n.fillStyle = md("#3a2c3e"); n.fillRect(0, FL - 24, STAGE_W, 2);
    for (let x = 6; x < STAGE_W; x += 48){
      n.fillStyle = md("#241a26"); n.fillRect(x, FL - 22, 5, 22);
    }
    floorTop = md("#7a5636"); floorMid = md("#5a3e26"); floorBot = md("#2e1e14");
  }
  else if (key === "foundry"){
    accent = md("#ffb347");
    ditherGradient(f, 0, 0, STAGE_W, 60, md("#160f18"), md("#2a1620"));
    ditherGradient(f, 0, 60, STAGE_W, 60, md("#2a1620"), md("#4a2020"));
    ditherGradient(f, 0, 120, STAGE_W, FL - 140, md("#4a2020"), md("#6e2e1e"));
    /* Roof trusses and lamps with dithered light cones. */
    f.fillStyle = md("#100b12"); f.fillRect(0, 8, STAGE_W, 7);
    for (let x = 0; x < STAGE_W; x += 26){ f.fillRect(x, 15, 3, 10); f.fillRect(x, 24, 26, 3); }
    for (let i = 0; i < 12; i++){
      const lx = 34 + i * 74;
      for (let k = 0; k < 4; k++)
        ditherRect(f, lx - 6 - k*4, 46 + k*8, 14 + k*8, 8, null, md("#ffb347"), 0.34 - k*0.07);
      f.fillStyle = md("#100b12"); f.fillRect(lx, 27, 2, 14);
      f.fillStyle = md("#2a1c22"); f.fillRect(lx - 7, 41, 16, 5);
      f.fillStyle = md("#ffe9a8"); f.fillRect(lx - 4, 46, 10, 2);
    }
    /* Furnace mouths: concentric dithered heat rather than hard rings. */
    for (let i = 0; i < 6; i++){
      const bx = 60 + i * 145, by = FL - 100;
      f.fillStyle = md("#0d0810"); f.fillRect(bx - 32, by, 78, 82);
      const heat = ["#3a1408","#6e2208","#a83a0a","#d4600c","#ffa020","#ffe9a8"];
      for (let g = 0; g < heat.length; g++){
        const inset = g * 4;
        f.fillStyle = md(heat[g]);
        f.fillRect(bx - 24 + inset, by + 26 + inset, 62 - inset*2, 48 - inset*2);
        /* a single dithered row where each step meets the next, so the rings
           blend without turning the whole mouth into speckle */
        if (g < heat.length - 1)
          ditherRect(f, bx - 24 + inset, by + 26 + inset, 62 - inset*2, 2,
                     null, md(heat[g + 1]), 0.5);
      }
    }
    /* Girders, three tones so they read as steel and not cardboard. */
    for (let i = 0; i < 14; i++){
      const gx = i*68;

  else if (key === "exchange"){

    /* --- foreground: desk tops cropped by the bottom of the frame -------- */
    for (let i = 0; i < 20; i++){

  else { /* neon */

    /* Far skyline: light and hazy, no detail — distance. */
    for (let i = 0; i < 46; i++){
      const bw = 24 + (rng()%52), bh = 26 + (rng()%60), bx = (rng() % (STAGE_W - 40));

    for (let i = 0; i < 18; i++){

    /* Signs, each with a dithered halo — the closest the hardware got to bloom. */
    const neons = ["#ff3d8b","#25f0d0","#ffd93d","#8a5cff","#4dd2ff"];

      ditherRect(n, cx - 4, cy - 4, wdt + 8, hgt + 8, null, col, 0.16);
